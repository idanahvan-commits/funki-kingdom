const CAT_COLORS={'הזזה':'#5ee3de','סיבוב':'#af9cff','שיקוף':'#ffb2ca','הגדלה והקטנה':'#f3d38a','משולב':'#bce8fa'};

const $=s=>document.querySelector(s), byId=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qById=id=>QUESTIONS.find(q=>q.id===id)||QUESTIONS[0];

const realConfigured=()=>!!(FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId&&FIREBASE_CONFIG.appId);
let toastTimer;function toast(msg){const el=byId('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500)}
function cleanSubscriptions(){if(state.currentSub){state.currentSub();state.currentSub=null}if(state.votesSub){state.votesSub();state.votesSub=null}}
function hrefFor(room,demo=false){const u=new URL(window.location.href);u.search='';u.hash='';u.searchParams.set('room',room);if(demo)u.searchParams.set('demo','1');return u.toString()}
function hostHref(room,demo=false){const u=new URL(hrefFor(room,demo));u.searchParams.set('host','1');return u.toString()}
function barData(){let t=0,f=0;for(const v of state.votes){if(v.choice===true)t++;if(v.choice===false)f++}return {t,f,n:t+f,tp:t+f?Math.round(t/(t+f)*100):0,fp:t+f?Math.round(f/(t+f)*100):0}}
function statusPill(){let demo=state.demo;return `<span class="status"><span class="dot ${demo?'demo':'live'}"></span>${demo?'הדגמה מקומית':'מפגש חי'}</span>`}
function home(){app.innerHTML=`<section class="hero"><span class="eyebrow">✦ השתלמות מורים · גאומטריה לכיתה ז׳ · התוכנית המעודכנת</span><h1 class="headline">נכון <em>או</em> לא נכון?<br>ממלכת התנועה</h1><p class="lead">32 טענות המעוררות חשיבה ודיון על הזזה, סיבוב, שיקוף ושינוי קנה מידה. מצביעים, בודקים מה חושבים האחרים, חושפים את הנימוק ומדגימים.</p><div class="flex"><span class="pill">7 טענות על הזזה</span><span class="pill">7 טענות על סיבוב</span><span class="pill">7 טענות על שיקוף</span><span class="pill">7 טענות על קנה מידה</span><span class="pill">4 טענות משולבות</span></div></section><div class="homegrid"><div class="card"><div class="bigicon">♛</div><h2>מסך המנחה</h2><p>שליטה בהצבעה, מעבר בין הטענות, צפייה בתוצאות בזמן אמת וחשיפת הסבר ודוגמה נגדית.</p><button class="btn primary tall" data-action="start-live" ${realConfigured()?'':'disabled'}>פתח מפגש חי</button><span class="mini">${realConfigured()?'מוכן לשימוש עם Firebase':'למפגש חי יש להוסיף תחילה את הגדרות Firebase לקובץ'}</span></div><div class="card"><div class="bigicon">◇</div><h2>הצטרפות משתתפים</h2><p>המורים נכנסים בקישור או בקוד מפגש ומצביעים בטלפון. אין צורך בשם או בחשבון אישי.</p><button class="btn cyan tall" data-action="join">הצטרפו למפגש</button><span class="mini">תצוגה מותאמת למחשב ולטלפון</span></div><div class="card"><div class="bigicon">✧</div><h2>התנסות מיידית</h2><p>נסו את החידון ופתחו שני חלונות באותו דפדפן לבדיקת המנחה והמשתתף לפני חיבור אמיתי.</p><button class="btn tall" data-action="start-demo">התחל מצב הדגמה</button><span class="mini">מצב ההדגמה אינו אוסף תשובות ממכשירים אחרים</span></div></div><p class="mini spaced">מבוסס על נושאי העתקות במישור ושינוי קנה מידה במסגרת עדכון תוכנית הלימודים בחטיבת הביניים, תשפ״ז.</p>`}
function joinScreen(){app.innerHTML=`<section class="surface joinpanel"><span class="eyebrow">◇ הצטרפות להצבעה</span><h1>מה קוד המפגש?</h1><p>הקלידו את הקוד שמופיע על מסך המנחה. אפשר גם להיכנס דרך הקישור שיישלח בקבוצת המשתתפים.</p><input id="roomCode" class="roominput" maxlength="8" placeholder="ABC123" aria-label="קוד מפגש" autocomplete="off"><div><button data-action="join-code" class="btn cyan tall">כניסה לחידון ←</button></div>${!realConfigured()?`<div class="alert" style="text-align:right;margin-top:24px">ההצטרפות החיה תופעל לאחר חיבור Firebase. לצורך בדיקה באותו דפדפן ניתן להצטרף לחדר DEMO26 כאשר המנחה פתח מצב הדגמה.</div>`:''}</section>`}
function diagramMarkup(cat,step=4){
 const pts=[[187,197],[215,112],[268,183]];const cx=307,cy=150;const factor=1+(step*.16), angle=step*15*Math.PI/180; let end=pts.map(([x,y])=>{
  if(cat==='הזזה')return [x+step*22,y-step*8];
  if(cat==='סיבוב')return [cx+(x-cx)*Math.cos(angle)-(y-cy)*Math.sin(angle),cy+(x-cx)*Math.sin(angle)+(y-cy)*Math.cos(angle)];
  if(cat==='שיקוף')return [600-x,y];
  return [126+(x-126)*factor,205+(y-205)*factor];
 });
 const points=a=>a.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
 const label=cat==='הזזה'?`הזזה ${step} ימינה`:(cat==='סיבוב'?`סיבוב ${(step*15)}°`:cat==='שיקוף'?'שיקוף ביחס לישר':`קנה מידה ${factor.toFixed(2)}`);
 const cx1=pts.reduce((a,p)=>a+p[0],0)/3,cy1=pts.reduce((a,p)=>a+p[1],0)/3;const cx2=end.reduce((a,p)=>a+p[0],0)/3,cy2=end.reduce((a,p)=>a+p[1],0)/3;
 let guide=cat==='שיקוף'?`<line x1="300" x2="300" y1="18" y2="262" stroke="#ffd1e0" stroke-dasharray="8 7" stroke-width="2.5"/><text x="309" y="29" font-size="13" fill="#ffd1e0">ישר השיקוף</text>`:cat==='סיבוב'?`<circle cx="${cx}" cy="${cy}" r="4.5" fill="#ffe2a6"/><circle cx="${cx}" cy="${cy}" r="77" fill="none" stroke="#9baee6" opacity=".32" stroke-dasharray="5 8"/><text x="314" y="147" font-size="13" fill="#ffe2a6">מרכז</text>`:cat==='הגדלה והקטנה'?`<circle cx="126" cy="205" r="4.5" fill="#ffe2a6"/><text x="106" y="224" font-size="12" fill="#ffe2a6">מרכז</text>`:`<path d="M${cx1+18} ${cy1-27}L${cx2-16} ${cy2-27}" stroke="#ffdca5" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)" />`;
 return `<svg viewBox="0 0 600 280" role="img" aria-label="המחשה להעתקה גאומטרית: מקור בצבע תכלת ותמונה בצבע זהב" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#7c9bd8" stroke-opacity=".19" stroke-width="1"/></pattern><marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#ffdca5" stroke-width="1.2"/></marker></defs><rect width="600" height="280" fill="url(#grid)"/><path d="M22 245H579" stroke="#9aafdf" opacity=".22"/>${guide}<polygon points="${points(pts)}" fill="#46d8e837" stroke="#61dbea" stroke-width="3.2" stroke-linejoin="round"/><polygon points="${points(end)}" fill="#ffdc9540" stroke="#f8d48e" stroke-width="3.3" stroke-linejoin="round"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#aaf8ff"/>`).join('')}${end.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#ffe5ad"/>`).join('')}<text x="${cx1.toFixed(1)}" y="${Math.min(260,cy1+41).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="bold" fill="#a9f8ff">מקור</text><text x="${cx2.toFixed(1)}" y="${Math.min(260,cy2+41).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffe7ae">תמונה</text><text x="23" y="26" font-size="14" fill="#d1ddfa">${esc(label)}</text></svg>`;
}
function categoryVisual(cat){return cat==='משולב'?'הזזה':cat}
function chartHtml(){const b=barData();return `<div class="results"><div class="flex" style="justify-content:space-between"><h3 style="margin:0 0 16px;color:#fff0c8">התפלגות תשובות</h3><span class="muted">${b.n} הצבעות</span></div><div class="result-row"><b>נכון</b><div class="bar"><div class="fill" style="width:${b.tp}%"></div></div><b class="num">${b.t} · ${b.tp}%</b></div><div class="result-row"><b>לא נכון</b><div class="bar"><div class="fill no" style="width:${b.fp}%"></div></div><b class="num">${b.f} · ${b.fp}%</b></div>${b.n===0?`<p class="mini">עדיין לא התקבלו הצבעות.</p>`:''}</div>`}
function explanationHtml(q){return `<div class="explain"><h3>${q.truth?'✓ נכון':'✕ לא נכון'} — ההסבר המתמטי</h3><p>${esc(q.e)}</p><div class="teacher-tip"><b>שאלה לדיון:</b> ${esc(q.tip)}</div></div>`}
function sidebarHtml(){let cats=['הזזה','סיבוב','שיקוף','הגדלה והקטנה','משולב'];return cats.map(cat=>`<div class="catgroup"><p class="catlabel">${esc(cat)}</p>${QUESTIONS.filter(q=>q.cat===cat).map(q=>`<button class="qitem ${q.id===cur().id?'current':''}" data-action="go-question" data-q="${q.id}"><span class="qnum">${QUESTIONS.indexOf(q)+1}.</span><span class="qtext">${esc(q.t)}</span></button>`).join('')}</div>`).join('')}
function hostScreen(){const q=cur(),i=qIndex(),b=barData(),phase=state.room?.phase||'voting';app.innerHTML=`<div class="sectionhead"><div><h1>♛ מסך המנחה</h1><p>ניהול ההצבעה וחשיפת התשובות · 32 טענות</p></div><div class="flex">${statusPill()}<span class="status">קוד מפגש: <span class="code">${esc(state.roomId)}</span></span></div></div>${state.demo?`<div class="alert">מצב הדגמה: תשובות מסתנכרנות רק בין חלונות באותו דפדפן ובאותו מחשב. הצבעות ממכשירים אחרים לא יגיעו לכאן. להפעלה חיה יש לחבר Firebase.</div>`:''}<div class="controlbar"><button class="btn small primary" data-action="copy-link">העתק קישור למשתתפים</button><button class="btn small ghost" data-action="open-participant">פתח תצוגת משתתף ↗</button><button class="btn small ghost" data-action="copy-code">העתק קוד</button><button class="btn small ghost" data-action="export">ייצוא CSV</button></div><div class="hostgrid"><div><section class="questionbox"><div class="qtop"><span class="pill" style="border-color:${CAT_COLORS[q.cat]}80;color:${CAT_COLORS[q.cat]}">${esc(q.cat)}</span><span class="qcounter">טענה ${i+1} מתוך ${QUESTIONS.length}</span><span class="status"><span class="dot ${phase==='voting'?'live':''}"></span>${phase==='voting'?'ההצבעה פתוחה':phase==='closed'?'ההצבעה סגורה':'התשובה נחשפה'}</span></div><div class="qtitle">${esc(q.t)}</div><div class="diagramframe">${diagramMarkup(categoryVisual(q.cat),state.videoStep)}</div><div class="legend"><span><span class="swatch"></span>צורת המקור</span><span><span class="swatch gold"></span>דמות לאחר העתקה</span></div><p class="labnote">המחשה כללית לסוג ההעתקה · אינה שרטוט של הטענה המסוימת</p><div class="flex" style="justify-content:center"><label class="muted" for="visualRange">שינוי ההמחשה</label><input type="range" id="visualRange" min="1" max="6" value="${state.videoStep}" style="accent-color:#f1ca83;max-width:230px;width:50%"></div><div class="gold-rule"></div><div class="flex"><span class="stat"><strong>${b.n}</strong>מורים הצביעו</span><span class="muted">${phase==='voting'?'אפשר להמשיך להצביע עד לסגירה':'אין אפשרות להצביע כרגע'}</span></div>${chartHtml()}${phase==='revealed'?explanationHtml(q):''}</section><div class="surface spaced"><div class="flex"><button class="btn ${phase==='voting'?'danger':'cyan'}" data-action="phase" data-phase="${phase==='voting'?'closed':'voting'}">${phase==='voting'?'סגור הצבעה':'פתח הצבעה'}</button><button class="btn primary" data-action="phase" data-phase="revealed" ${phase==='revealed'?'disabled':''}>חשוף תשובה והסבר</button><button class="btn ghost" data-action="clear">אפס הצבעות לטענה</button></div><div class="gold-rule"></div><div class="flex"><button class="btn ghost" data-action="prev" ${i===0?'disabled':''}>→ טענה קודמת</button><button class="btn primary push" data-action="next" ${i===QUESTIONS.length-1?'disabled':''}>טענה הבאה ←</button></div></div></div><aside class="surface sidebar"><h3>מאגר הטענות</h3><p class="mini">בחרו טענה בכל סדר שתרצו. המעבר פותח הצבעה בטענה הנבחרת.</p>${sidebarHtml()}</aside></div>`}
function participantScreen(){const q=cur(),phase=state.room?.phase||'voting',i=qIndex(),mine=state.myChoice,b=barData();app.innerHTML=`<div class="participant"><div class="sectionhead"><div><h1>◇ חידון ממלכת התנועה</h1><p>בחרו נכון או לא נכון. תוכלו לשנות תשובה עד סגירת ההצבעה.</p></div><div class="flex">${statusPill()}<span class="status">${esc(state.roomId)}</span></div></div>${state.demo?`<div class="alert">זהו מצב הדגמה מקומי, לא הצבעה מרחוק.</div>`:''}<section class="questionbox"><div class="qtop"><span class="pill" style="color:${CAT_COLORS[q.cat]};border-color:${CAT_COLORS[q.cat]}80">${esc(q.cat)}</span><span class="qcounter">טענה ${i+1} מתוך ${QUESTIONS.length}</span></div><div class="qtitle">${esc(q.t)}</div><div class="answerButtons"><button class="answer ${mine===true?'active':''}" data-action="vote" data-choice="true" ${phase!=='voting'?'disabled':''}><span class="ansicon">✓</span> נכון</button><button class="answer false ${mine===false?'active':''}" data-action="vote" data-choice="false" ${phase!=='voting'?'disabled':''}><span class="ansicon">✕</span> לא נכון</button></div><div class="partmsg center">${phase==='voting'?(mine===null?'בחרו תשובה. המנחה עדיין לא חשף את התשובה.':`התשובה שלך נקלטה: <b>${mine?'נכון':'לא נכון'}</b> ✓`):phase==='closed'?'ההצבעה נסגרה. ממתינים לחשיפת התשובה.':'התשובה נחשפה! אפשר לעבור יחד על ההסבר.'}</div>${phase==='revealed'?`${chartHtml()}${explanationHtml(q)}`:''}</section><p class="mini center spaced">המעבר לטענה הבאה יתבצע אוטומטית כאשר המנחה יתקדם.</p></div>`}
function render(){if(state.mode==='home')home();if(state.mode==='join')joinScreen();if(state.mode==='host')hostScreen();if(state.mode==='participant')participantScreen()}
function safeRoom(id){return /^[A-Z0-9]{5,8}$/.test(id)}
function makeRoomCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const arr=new Uint32Array(6);if(window.crypto?.getRandomValues)crypto.getRandomValues(arr);else for(let i=0;i<6;i++)arr[i]=Math.random()*0xffffffff;return Array.from(arr,x=>alphabet[x%alphabet.length]).join('')}
function demoRoomKey(){return `kingdom_motion_demo_room_${state.roomId}`}
function demoVoteKey(id){return `kingdom_motion_demo_votes_${state.roomId}_${id}`}
function getDemoVotes(id){try{return Object.entries(JSON.parse(localStorage.getItem(demoVoteKey(id))||'{}')).map(([uid,choice])=>({uid,choice}))}catch{return []}}
function sendDemoUpdate(){localStorage.setItem('kingdom_motion_demo_update',String(Date.now()));try{new BroadcastChannel('kingdom-motion-demo').postMessage({room:state.roomId})}catch{}}
function syncDemo(){if(!state.demo)return;try{state.room=JSON.parse(localStorage.getItem(demoRoomKey())||'null')}catch{state.room=null}if(!state.room){state.room={currentId:'q01',phase:'voting'}}state.votes=getDemoVotes(state.room.currentId);state.myChoice=state.votes.find(v=>v.uid===getDemoUID())?.choice??null;render()}
function getDemoUID(){let id=sessionStorage.getItem('kingdom_motion_demo_uid');if(!id){id='participant_'+Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('kingdom_motion_demo_uid',id)}return id}
function setDemoRoom(room){state.room=room;localStorage.setItem(demoRoomKey(),JSON.stringify(room));sendDemoUpdate();syncDemo()}
function connectDemo(roomId,mode){cleanSubscriptions();state={...state,demo:true,mode,roomId,room:null,votes:[],myChoice:null};if(mode==='host'){setDemoRoom({currentId:'q01',phase:'voting',hostUid:'demo'})}else if(localStorage.getItem(demoRoomKey()))syncDemo();else{state.mode='join';render();toast('חדר ההדגמה אינו פעיל עדיין. יש לפתוח אותו תחילה במסך המנחה.');return}history.replaceState(null,'',mode==='host'?hostHref(roomId,true):hrefFor(roomId,true));syncDemo()}
async function initFirebase(){if(state.fire)return state.fire;if(!realConfigured())throw new Error('טרם הוגדר Firebase בקובץ.');
 const [appM,authM,fsM]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);
 const firebaseApp=appM.initializeApp(FIREBASE_CONFIG);const auth=authM.getAuth(firebaseApp);const db=fsM.getFirestore(firebaseApp);const creds=await authM.signInAnonymously(auth);state.authUid=creds.user.uid;state.fire={db,auth,fsM};return state.fire;
}
function snapshotVotes(qid){if(state.votesSub){state.votesSub();state.votesSub=null}if(!state.fire)return;const f=state.fire.fsM;const ref=f.collection(state.fire.db,'motionQuizRooms',state.roomId,'questions',qid,'votes');state.votesSub=f.onSnapshot(ref,snap=>{state.votes=snap.docs.map(doc=>({uid:doc.id,choice:doc.data().choice}));state.myChoice=state.votes.find(v=>v.uid===state.authUid)?.choice??null;render()},err=>toast('שגיאה בקבלת ההצבעות: '+err.message))}
function subscribeRoom(){cleanSubscriptions();const f=state.fire.fsM;const ref=f.doc(state.fire.db,'motionQuizRooms',state.roomId);let oldId=null;state.currentSub=f.onSnapshot(ref,snap=>{
 if(!snap.exists()){toast('המפגש לא נמצא. בדקו את הקוד.');state.mode='join';cleanSubscriptions();render();return}
 const room=snap.data();if(state.mode==='host'&&room.hostUid!==state.authUid){state.mode='participant';toast('ניהול המפגש זמין רק בדפדפן שבו הוא נפתח.')}
 state.room=room;if(room.currentId!==oldId){oldId=room.currentId;state.votes=[];state.myChoice=null;snapshotVotes(room.currentId)}render();
 },err=>toast('שגיאת תקשורת: '+err.message));
}
async function startLive(){if(state.busy)return;state.busy=true;try{
 const f=await initFirebase(),fs=f.fsM;let roomId=makeRoomCode();for(let i=0;i<4;i++){const check=await fs.getDoc(fs.doc(f.db,'motionQuizRooms',roomId));if(!check.exists())break;roomId=makeRoomCode()}
 state.roomId=roomId;state.mode='host';state.demo=false;state.room={currentId:'q01',phase:'voting',hostUid:state.authUid};await fs.setDoc(fs.doc(f.db,'motionQuizRooms',roomId),{...state.room,createdAt:fs.serverTimestamp()});history.replaceState(null,'',hostHref(roomId));subscribeRoom();render();toast('המפגש החי נפתח. העתיקו את הקישור למשתתפים.');
 }catch(err){console.error(err);toast('פתיחת המפגש נכשלה: '+err.message)}finally{state.busy=false}}
async function joinExisting(roomId,demo=false,host=false){roomId=roomId.toUpperCase().trim();if(!safeRoom(roomId)){toast('יש להזין קוד מפגש תקין.');return}if(demo){connectDemo(roomId,host?'host':'participant');return}if(!realConfigured()){toast('החיבור החי עדיין לא הוגדר. יש להוסיף הגדרות Firebase לקובץ.');return}if(state.busy)return;state.busy=true;try{
 await initFirebase();state.demo=false;state.mode=host?'host':'participant';state.roomId=roomId;state.votes=[];state.myChoice=null;history.replaceState(null,'',host?hostHref(roomId):hrefFor(roomId));subscribeRoom();render();
 }catch(err){console.error(err);toast('לא ניתן להיכנס: '+err.message);state.mode='join';render()}finally{state.busy=false}}
async function changeQuestion(id){if(state.mode!=='host'||!qById(id)||state.room?.currentId===id)return;
 if(state.demo){setDemoRoom({...state.room,currentId:id,phase:'voting'});return}
 try{const f=state.fire;await f.fsM.updateDoc(f.fsM.doc(f.db,'motionQuizRooms',state.roomId),{currentId:id,phase:'voting'})}catch(err){toast('המעבר נכשל: '+err.message)}}
async function changePhase(phase){if(state.mode!=='host'||!['voting','closed','revealed'].includes(phase))return;
 if(state.demo){setDemoRoom({...state.room,phase});return}
 try{const f=state.fire;await f.fsM.updateDoc(f.fsM.doc(f.db,'motionQuizRooms',state.roomId),{phase})}catch(err){toast('עדכון ההצבעה נכשל: '+err.message)}}
async function vote(choice){if(state.mode!=='participant'||state.room?.phase!=='voting'||state.myChoice===choice)return;
 if(state.demo){const key=demoVoteKey(cur().id),old=JSON.parse(localStorage.getItem(key)||'{}');old[getDemoUID()]=choice;localStorage.setItem(key,JSON.stringify(old));sendDemoUpdate();syncDemo();return}
 try{const f=state.fire;await f.fsM.setDoc(f.fsM.doc(f.db,'motionQuizRooms',state.roomId,'questions',cur().id,'votes',state.authUid),{choice,updatedAt:f.fsM.serverTimestamp()});toast('התשובה נקלטה ✓')}catch(err){toast('ההצבעה נכשלה: '+err.message)}}
async function clearCurrentVotes(){if(state.mode!=='host')return;if(!confirm('לאפס את כל ההצבעות בטענה הנוכחית?'))return;
 if(state.demo){localStorage.removeItem(demoVoteKey(cur().id));sendDemoUpdate();syncDemo();toast('ההצבעות אופסו.');return}
 try{const f=state.fire,fs=f.fsM;const snaps=await fs.getDocs(fs.collection(f.db,'motionQuizRooms',state.roomId,'questions',cur().id,'votes'));
 // Firestore batches support at most 500 writes; a single training question has much fewer.
 const batch=fs.writeBatch(f.db);snaps.docs.forEach(d=>batch.delete(d.ref));await batch.commit();toast('ההצבעות אופסו.');
 }catch(err){toast('האיפוס נכשל: '+err.message)}}
function downloadCSV(rows){const content='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([content],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`kingdom-motion-${state.roomId}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function exportResults(){if(state.mode!=='host')return;toast('מכין דוח תוצאות...');const rows=[['מספר','נושא','טענה','תשובה נכונה','הצביעו נכון','הצביעו לא נכון','סך הצבעות','אחוז צדקו']];try{
 for(let i=0;i<QUESTIONS.length;i++){const q=QUESTIONS[i];let votes;if(state.demo)votes=getDemoVotes(q.id);else{const f=state.fire;const docs=await f.fsM.getDocs(f.fsM.collection(f.db,'motionQuizRooms',state.roomId,'questions',q.id,'votes'));votes=docs.docs.map(d=>d.data())}const yes=votes.filter(v=>v.choice===true).length,no=votes.filter(v=>v.choice===false).length,n=yes+no;rows.push([i+1,q.cat,q.t,q.truth?'נכון':'לא נכון',yes,no,n,n?`${Math.round(100*(q.truth?yes:no)/n)}%`:'—'])}
 downloadCSV(rows);toast('הדוח ירד למחשב.');
 }catch(err){toast('ייצוא נכשל: '+err.message)}}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('הועתק ללוח!')}catch{const input=document.createElement('textarea');input.value=s;input.style.position='fixed';document.body.appendChild(input);input.select();const ok=document.execCommand('copy');input.remove();toast(ok?'הועתק ללוח!':'לא ניתן להעתיק אוטומטית.')}}
function goHome(){cleanSubscriptions();state.mode='home';state.room=null;state.votes=[];state.demo=false;history.replaceState(null,'',location.pathname);render()}
document.addEventListener('click',async event=>{
 const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
 if(action==='home'){goHome();return}if(action==='join'){state.mode='join';render();return}if(action==='start-demo'){connectDemo('DEMO26','host');return}if(action==='start-live'){await startLive();return}if(action==='join-code'){await joinExisting((byId('roomCode')?.value||'').toUpperCase(),(byId('roomCode')?.value||'').toUpperCase()==='DEMO26'&&!realConfigured());return}
 if(action==='vote'){await vote(el.dataset.choice==='true');return}if(action==='phase'){await changePhase(el.dataset.phase);return}if(action==='go-question'){await changeQuestion(el.dataset.q);return}if(action==='next'){await changeQuestion(QUESTIONS[qIndex()+1]?.id);return}if(action==='prev'){await changeQuestion(QUESTIONS[qIndex()-1]?.id);return}if(action==='clear'){await clearCurrentVotes();return}
 if(action==='copy-code'){copyText(state.roomId);return}if(action==='copy-link'){copyText(hrefFor(state.roomId,state.demo));return}if(action==='open-participant'){window.open(hrefFor(state.roomId,state.demo),'_blank','noopener');return}if(action==='export'){await exportResults();return}
});
document.addEventListener('input',e=>{
 if(e.target.id==='visualRange'){state.videoStep=Number(e.target.value);const diagram=$('.diagramframe');if(diagram)diagram.innerHTML=diagramMarkup(categoryVisual(cur().cat),state.videoStep)}
 if(e.target.id==='roomCode')e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='roomCode'){document.querySelector('[data-action="join-code"]')?.click()}});
window.addEventListener('storage',e=>{if(state.demo&&e.key?.startsWith('kingdom_motion_demo_'))syncDemo()});
try{const bc=new BroadcastChannel('kingdom-motion-demo');bc.onmessage=()=>{if(state.demo)syncDemo()}}catch{}
render();
const params=new URLSearchParams(location.search);
if(params.has('room')){joinExisting(params.get('room')||'',params.get('demo')==='1',params.get('host')==='1')}
</script>
</body>
</html>
