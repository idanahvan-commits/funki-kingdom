<!-- V6: EMPTY CAR UNTIL AN EXPLICIT USER NUMBER IS CHOSEN -->
<style id="v6-empty-car-until-user-choice">
  /* The bonnet starts completely clean. Its token only exists after a real user choice. */
  body:not(.ride-has-user-number) #carNumber{
    display:none!important;
    visibility:hidden!important;
    opacity:0!important;
  }
  body:not(.ride-has-user-number) #vehicle.charging{
    animation:none!important;
  }
</style>
<script id="v6-empty-car-until-user-choice-script">
(function(){
  let hasUserNumber=false;
  let userChoiceArmed=false;

  const carToken=()=>document.getElementById('carNumber');
  const syncFlag=()=>{
    document.body.classList.toggle('ride-has-user-number',hasUserNumber);
    const token=carToken();
    if(!hasUserNumber && token){
      token.hidden=true;
      token.textContent='';
      token.style.setProperty('display','none','important');
      token.style.setProperty('opacity','0','important');
    }
    if(!hasUserNumber && window.state){
      state.charging=false;
      state.chargeUntil=0;
      const vehicle=document.getElementById('vehicle');
      vehicle?.classList.remove('charging','input-hover');
    }
  };

  const armRealChoice=()=>{
    userChoiceArmed=true;
    hasUserNumber=true;
    document.body.classList.add('ride-has-user-number');
  };

  /* Capture before the existing handlers call setNumber(), so the same click can load the car. */
  document.addEventListener('click',e=>{
    if(e.target.closest('.input-calc-ok,.character-choice,.core-cell')) armRealChoice();
  },true);

  /* Keyboard confirmation inside the calculator is also a real user choice. */
  document.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ') && e.target.closest('.input-calc-wrap')) armRealChoice();
  },true);

  const previousRender=window.render;
  if(typeof previousRender==='function'){
    const guardedRender=function(){
      if(!hasUserNumber && window.state){state.charging=false;state.chargeUntil=0}
      const out=previousRender.apply(this,arguments);
      const token=carToken();
      if(!hasUserNumber && token){
        token.hidden=true;
        token.textContent='';
        token.style.setProperty('display','none','important');
        token.style.setProperty('opacity','0','important');
      }else if(hasUserNumber && token){
        /* Let the approved ride logic decide when the token hides while travelling through the cave. */
        token.style.removeProperty('visibility');
      }
      document.body.classList.toggle('ride-has-user-number',hasUserNumber);
      return out;
    };
    try{window.render=guardedRender;render=guardedRender}catch(_e){window.render=guardedRender}
  }

  /* A new function starts a fresh cycle: no old number remains on the bonnet. */
  window.addEventListener('functionride:change',()=>{
    hasUserNumber=false;
    userChoiceArmed=false;
    syncFlag();
    requestAnimationFrame(()=>{
      try{window.render?.()}catch(_e){}
      syncFlag();
    });
  });

  /* Public helper for future integrations/editors. */
  window.CarInputState={
    hasUserNumber:()=>hasUserNumber,
    clear:()=>{hasUserNumber=false;userChoiceArmed=false;syncFlag();try{window.render?.()}catch(_e){}},
    arm:()=>{armRealChoice();syncFlag()}
  };

  hasUserNumber=false;
  userChoiceArmed=false;
  syncFlag();
  requestAnimationFrame(()=>{syncFlag();try{window.render?.()}catch(_e){}});
})();
</script>

  }
</style>
<script id="v7-empty-input-until-user-choice-script">
(function(){
  function hasChoice(){
    try{return !!window.CarInputState?.hasUserNumber?.()}catch(_e){return document.body.classList.contains('ride-has-user-number')}
  }
  function enforce(){
    const value=document.getElementById('chargeValue');
    const bar=document.querySelector('.v50-charge-bar.input');
    const chosen=hasChoice();
    document.body.classList.toggle('ride-has-user-number',chosen);
    if(value){
      if(!chosen){
        value.style.setProperty('visibility','hidden','important');
        value.style.setProperty('opacity','0','important');
        value.style.setProperty('color','transparent','important');
      }else{
        value.style.removeProperty('visibility');
        value.style.removeProperty('opacity');
        value.style.removeProperty('color');
      }
    }
    if(bar && !chosen){
      bar.hidden=true;
      bar.classList.remove('is-loading');
    }
  }

  /* Run after the existing selection handlers have written the chosen value. */
  document.addEventListener('click',e=>{
    if(e.target.closest('.input-calc-ok,.character-choice,.core-cell')) requestAnimationFrame(enforce);
  },false);
  document.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ') && e.target.closest('.input-calc-wrap')) requestAnimationFrame(enforce);
  },false);

  window.addEventListener('functionride:change',()=>requestAnimationFrame(enforce));
  window.addEventListener('load',()=>requestAnimationFrame(enforce),{once:true});

  /* If another part of the ride mutates the value before a choice, keep it visually blank. */
  const value=document.getElementById('chargeValue');
  if(value){
    new MutationObserver(()=>requestAnimationFrame(enforce)).observe(value,{childList:true,characterData:true,subtree:true});
  }
  enforce();
})();
</script>


<!-- V8: THE INPUT CRYSTAL HAS NO CAPSULE AT ALL BEFORE THE FIRST REAL CHOICE -->

<script id="v8-clean-input-crystal-until-choice-script">
(function(){
  'use strict';
  function hasChoice(){
    try{return !!window.CarInputState?.hasUserNumber?.();}catch(_e){return document.body.classList.contains('ride-has-user-number');}
  }
  function sync(){
    const dock=document.getElementById('chargeDock');
    const chosen=hasChoice();
    document.body.classList.toggle('ride-has-user-number',chosen);
    if(!dock)return;
    if(!chosen){
      dock.style.setProperty('display','none','important');
      dock.style.setProperty('visibility','hidden','important');
      dock.style.setProperty('opacity','0','important');
      dock.classList.remove('charging');
    }else{
      dock.style.removeProperty('display');
      dock.style.removeProperty('visibility');
      dock.style.removeProperty('opacity');
    }
  }

  document.addEventListener('click',function(e){
    if(e.target.closest('.input-calc-ok,.character-choice,.core-cell,[data-calc-action="ok"]')) requestAnimationFrame(sync);
  },false);
  document.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ') && e.target.closest('.input-calc-wrap')) requestAnimationFrame(sync);
  },false);
  window.addEventListener('functionride:change',function(){requestAnimationFrame(sync);});
  window.addEventListener('load',function(){requestAnimationFrame(sync);},{once:true});
  sync();
})();
</script>



<style id="combined-objects-inside-slider-lock">
/* No visible settling animation: the approved balanced geometry is applied before first paint. */
#valueTablePanel,#approvedMagicAxes{transition:none!important;}
</style>
<script id="combined-objects-inside-slider-script">
(function(){
  'use strict';
  let lastAppliedShift=0;
  function balance(){
    const ride=document.getElementById('ride');
    const deck=document.querySelector('.control-deck');
    const table=document.getElementById('valueTablePanel');
    const axes=document.getElementById('approvedMagicAxes');
    if(!ride||!deck||!table||!axes)return false;
    if(table.classList.contains('vt-minimized')||axes.classList.contains('ma-minimized'))return false;

    /* Undo only our previous responsive correction before measuring again. */
    const undo=(el,varName)=>{
      if(!lastAppliedShift)return;
      const raw=getComputedStyle(el).getPropertyValue(varName).trim();
      const n=parseFloat(raw);
      if(Number.isFinite(n))el.style.setProperty(varName,(n-lastAppliedShift).toFixed(4)+'%');
    };
    undo(table,'--vt-right');
    undo(axes,'--ma-right');
    lastAppliedShift=0;

    const rr=ride.getBoundingClientRect(),dr=deck.getBoundingClientRect();
    const tr=table.getBoundingClientRect(),ar=axes.getBoundingClientRect();
    if(!rr.width||!dr.width||!tr.width||!ar.width)return false;
    const groupLeft=Math.min(tr.left,ar.left);
    const groupRight=Math.max(tr.right,ar.right);
    const deckCenter=(dr.left+dr.right)/2;
    const groupCenter=(groupLeft+groupRight)/2;
    let dx=deckCenter-groupCenter;
    const shiftedLeft=groupLeft+dx, shiftedRight=groupRight+dx;
    if(shiftedLeft<dr.left)dx+=dr.left-shiftedLeft;
    if(shiftedRight>dr.right)dx-=shiftedRight-dr.right;
    const deltaPct=dx/rr.width*100;
    const readRight=(el,varName)=>{
      const raw=getComputedStyle(el).getPropertyValue(varName).trim();
      const n=parseFloat(raw);
      return Number.isFinite(n)?n:null;
    };
    const vt=readRight(table,'--vt-right');
    const ma=readRight(axes,'--ma-right');
    /* right decreases when moving right, so subtract the measured horizontal delta. */
    if(vt!==null)table.style.setProperty('--vt-right',(vt-deltaPct).toFixed(4)+'%');
    if(ma!==null)axes.style.setProperty('--ma-right',(ma-deltaPct).toFixed(4)+'%');
    lastAppliedShift=-deltaPct;
    table.dataset.balancedShiftPct=deltaPct.toFixed(4);
    axes.dataset.balancedShiftPct=deltaPct.toFixed(4);
    return true;
  }

  /* This script is at the end of <body>, after both objects were created.
     Force layout and place them synchronously, before the browser paints the page. */
  const revealWhenBalanced=()=>{
    if(balance()){
      document.documentElement.classList.add('combined-balanced-ready');
      return true;
    }
    return false;
  };
  if(!revealWhenBalanced()){
    /* Fallback only if layout dimensions were not ready yet; objects remain hidden, so no jump is visible. */
    requestAnimationFrame(()=>{if(!revealWhenBalanced())window.addEventListener('load',revealWhenBalanced,{once:true});});
  }

  /* Responsive correction is instantaneous, with no animation. */
  window.addEventListener('resize',()=>{balance();},{passive:true});
})();
</script>

<script id="v43-slider-only-smoothing-script">
(()=>{
  'use strict';
  const progress=document.getElementById('progress');
  const timeline=progress&&progress.closest('.timeline');
  const ride=document.getElementById('ride');
  if(!progress||!timeline||!ride||document.getElementById('progressSmoothThumb'))return;

  const thumb=document.createElement('span');
  thumb.id='progressSmoothThumb';
  thumb.setAttribute('aria-hidden','true');
  timeline.appendChild(thumb);

  const RIDE_MS=14000;
  let animating=false;
  let lastRunning=ride.classList.contains('running');

  function pNow(){
    const max=Number(progress.max)||10000;
    const v=Number(progress.value)||0;
    return Math.max(0,Math.min(1,v/max));
  }
  function pointFor(p){
    const thumbW=19;
    const usable=Math.max(1,progress.clientWidth-thumbW);
    const reversed=timeline.classList.contains('reversed');
    const logical=reversed?(1-p):p;
    const x=progress.offsetLeft+thumbW/2+logical*usable;
    const y=progress.offsetTop+progress.offsetHeight/2;
    return {x,y};
  }
  function setPoint(p,withTransition,duration){
    const {x,y}=pointFor(p);
    thumb.style.transition=withTransition?`transform ${Math.max(0,duration)}ms linear`:'none';
    thumb.style.transform=`translate3d(${x}px,${y}px,0) translate(-50%,-50%)`;
  }
  function snap(){
    animating=false;
    setPoint(pNow(),false,0);
  }
  function runToEnd(){
    const p=pNow();
    const remaining=Math.max(0,(1-p)*RIDE_MS);
    setPoint(p,false,0);
    // Commit the exact starting position before asking the compositor to travel to the end.
    void thumb.offsetWidth;
    animating=true;
    setPoint(1,true,remaining);
  }

  progress.addEventListener('input',snap,{passive:true});
  progress.addEventListener('change',snap,{passive:true});
  window.addEventListener('resize',()=>{ if(!animating)snap(); },{passive:true});
  document.getElementById('forward')?.addEventListener('click',()=>requestAnimationFrame(snap));
  document.getElementById('reverse')?.addEventListener('click',()=>requestAnimationFrame(snap));

  // Observe only the existing running-state flag. Nothing in vehicle/cave rendering is modified.
  const obs=new MutationObserver(()=>{
    const running=ride.classList.contains('running');
    if(running!==lastRunning){
      lastRunning=running;
      if(running)runToEnd(); else snap();
    }
  });
  obs.observe(ride,{attributes:true,attributeFilter:['class']});

  // Keep programmatic resets/new input aligned while stopped, without touching the ride renderer.
  let lastValue=progress.value;
  const idleSync=()=>{
    const running=ride.classList.contains('running');
    if(!running&&progress.value!==lastValue){lastValue=progress.value;snap()}
    else lastValue=progress.value;
    requestAnimationFrame(idleSync);
  };

  requestAnimationFrame(()=>{snap();requestAnimationFrame(idleSync)});
})();
</script>

<script id="final-microfix-reverse-gap-inline-script">
(function(){

  function enforceReverseInputWait(){
    const dock=document.getElementById('chargeDock');
    const value=document.getElementById('chargeValue');
    const st=(typeof state!=='undefined'&&state)?state:(window.state||{});
    const waiting=!!st.reverse && Number(st.p||0)<0.995;

      if(value){

  function keepEquationStraight(){

      enforceReverseInputWait();
      keepEquationStraight();

    };
    try{window.render=patchedRender;render=patchedRender;}catch(_e){window.render=patchedRender;}

  document.addEventListener('click',e=>{
    if(e.target.closest('.character-choice,.core-cell,.input-calc-ok,[data-calc-action="ok"],#operator,[data-calc-key]')) schedule();

})();

<script id="v57-hard-left-lock">
/* V57: if development math reaches the left board edge, pin LEFT immediately and continue growing only to the RIGHT. */
(function(){
  window.fitEquationOneLine=function(){
    const eq=document.getElementById('equation'),box=document.getElementById('calculation'),ride=document.getElementById('ride');
    if(!eq||!box||!ride)return;

    const LEFT=.42951, RIGHT=.59444, TOP=.44344, BOTTOM=.60181;
    const p=(typeof state!=='undefined'&&state)?Number(state.p||0):0;
    const baseFunction=p<.475;
    const cfg=(typeof currentConfig!=='undefined'&&currentConfig)?currentConfig:(window.__FUNCTION_RIDE_CONFIG__||{});
    const EPS=1e-9;

    function preferredScenarioPx(){
      if(cfg.type!=='quadratic')return 46;
      const a=Math.abs(Number(cfg.a)||0)>EPS;
      const b=Math.abs(Number(cfg.b)||0)>EPS;
      const c=Math.abs(Number(cfg.c)||0)>EPS;
      const terms=(a?1:0)+(b?1:0)+(c?1:0);
      if(terms<=1)return 52;
      if(terms===2)return 42;
      return 33;
    }

    eq.style.whiteSpace='nowrap';
    eq.style.flexWrap='nowrap';
    eq.style.width='max-content';
    eq.style.maxWidth='none';
    eq.style.margin='0';
    eq.style.transform='none';
    eq.style.alignSelf='center';
    eq.style.transformOrigin='left center';
    box.style.display='flex';
    box.style.alignItems='center';
    box.style.overflow='visible';

    const preferred=preferredScenarioPx();
    const rr=ride.getBoundingClientRect();
    const boardW=Math.max(1,rr.width*(RIGHT-LEFT));
    const boardH=Math.max(1,rr.height*(BOTTOM-TOP));
    const safeW=Math.max(1,boardW-4);
    const safeH=Math.max(1,boardH-4);

    function setSize(px){
      eq.style.setProperty('font-size',px+'px','important');
      eq.dataset.caveFontPx=String(Math.round(px*100)/100);
    }
    function measure(){return eq.getBoundingClientRect()}
    function centerEquation(){
      box.style.setProperty('justify-content','center','important');
      box.style.setProperty('text-align','center','important');
      eq.style.setProperty('margin-left','auto','important');
      eq.style.setProperty('margin-right','auto','important');
      eq.dataset.leftLocked='0';
    }
    function lockLeft(){
      box.style.setProperty('justify-content','flex-start','important');
      box.style.setProperty('text-align','left','important');
      eq.style.setProperty('margin-left','0','important');
      eq.style.setProperty('margin-right','0','important');
      eq.dataset.leftLocked='1';
    }

    setSize(preferred);
    let er=measure();

    if(baseFunction){
      const scale=Math.min(1, safeW/Math.max(1,er.width), safeH/Math.max(1,er.height));
      if(scale<.999){
        setSize(Math.max(8,preferred*scale));
        er=measure();
        if(er.width>safeW+.5 || er.height>safeH+.5){
          const guardScale=Math.min(1,safeW/Math.max(1,er.width),safeH/Math.max(1,er.height));
          setSize(Math.max(8,parseFloat(eq.dataset.caveFontPx||preferred)*guardScale));
          er=measure();
        }
      }
      centerEquation();
    }else{
      const developmentMin=Math.min(preferred,24);
      let target=preferred;
      if(er.height>safeH+.5){
        target=Math.max(developmentMin,target*(safeH/Math.max(1,er.height)));
        setSize(target); er=measure();
      }
      if(er.width>safeW+.5 && target>developmentMin){
        target=Math.max(developmentMin,target*(safeW/Math.max(1,er.width)));
        setSize(target); er=measure();
      }

      const centeredLeftFree=(safeW-er.width)/2;
      const hitOrPassedLeftEdge=centeredLeftFree<=2;
      const stillTooWide=er.width>safeW+.5;

      if(stillTooWide || hitOrPassedLeftEdge){
        lockLeft();
      }else{
        centerEquation();
      }
    }

    box.dataset.boardWidthPx=String(Math.round(boardW*100)/100);
    box.dataset.boardHeightPx=String(Math.round(boardH*100)/100);
    box.dataset.scenarioPreferredPx=String(preferred);
  };

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>{try{window.fitEquationOneLine()}catch(_e){}});
  }else{
    try{window.fitEquationOneLine()}catch(_e){}
  }
})();
</script>

  pointer-events:none;
  display:none;
  width:max-content;
  min-width:0;
  padding:0;
  margin:0;
  border:0;
  border-radius:0;
  background:transparent!important;
  box-shadow:none!important;
  white-space:nowrap;
  transform:translate(-50%,-50%);
  transform-origin:center;
  transition:none;
  direction:ltr;
  unicode-bidi:isolate;
  text-align:center;
}

/* Result emerging from the chamber remains a bare mathematical number. */
#v67ResultTraveler{
  position:absolute;
  z-index:221;
  pointer-events:none;
  display:none;
  align-items:center;
  justify-content:center;
  width:max-content;
  min-width:0;
  padding:0;
  margin:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  font-family:var(--final-number-font, Georgia, serif);
  font-size:var(--car-font,31px);
  font-weight:600;
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  transform:translate(-50%,-50%);
  transform-origin:center;
  transition:none;
}
#v67ResultTraveler.v67-input-role{
  color:#effdff;
  text-shadow:0 0 4px #fff,0 0 10px #59eaff,0 0 18px rgba(84,137,255,.35);
}
#v67ResultTraveler.v67-output-role{
  color:#fff4fa;
  text-shadow:0 0 4px #fff,0 0 10px #ff8bcd,0 0 18px rgba(174,92,255,.28);
}

/* Flying capsule used only for car -> upper point launches. */
#v67FlightBadge{
  --v67-ring:#65efff;
  position:absolute;
  z-index:222;
  pointer-events:none;
  display:none;
  align-items:center;
  justify-content:center;
  min-width:54px;
  width:var(--car-w,max-content);
  max-width:180px;
  height:auto;
  padding:5px 12px;
  box-sizing:border-box;
  border:2px solid rgba(190,247,255,.97);
  border-radius:999px;
  background:linear-gradient(180deg,rgba(49,84,137,.97),rgba(20,43,84,.985));
  color:#f3fdff;
  font-family:var(--final-number-font, Georgia, serif);
  font-size:var(--car-font,31px);
  font-weight:600;
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  text-shadow:0 0 4px #fff,0 0 10px #59eaff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30),inset 0 0 11px rgba(104,235,255,.16),0 0 8px rgba(82,231,255,.48),0 0 19px rgba(84,137,255,.28);
  transform:translate(-50%,-50%);
  transform-origin:center;
  overflow:visible;
}
#v67FlightBadge.v67-output{
  --v67-ring:#ff83c3;
  border-color:rgba(255,211,232,.97);
  background:linear-gradient(180deg,rgba(129,48,90,.97),rgba(63,23,58,.985));
  color:#fff4fa;
  text-shadow:0 0 4px #fff,0 0 10px #ff8bcd;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 11px rgba(255,161,211,.13),0 0 8px rgba(255,112,184,.5),0 0 19px rgba(174,92,255,.22);
}
#v67FlightBadge::before,
#v67FlightBadge::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  border:2px solid color-mix(in srgb, var(--v67-ring) 85%, white 15%);
  box-shadow:0 0 8px var(--v67-ring), inset 0 0 6px color-mix(in srgb, var(--v67-ring) 55%, white 45%);
  opacity:.82;
  mix-blend-mode:screen;
}
#v67FlightBadge::before{
  width:calc(100% + 18px);
  height:calc(100% + 6px);
  border-left-color:transparent;
  border-right-color:transparent;
  animation:v67OrbitA 1200ms linear infinite;
}
#v67FlightBadge::after{
  width:calc(100% + 30px);
  height:calc(100% + 18px);
  border-top-color:transparent;
  border-bottom-color:transparent;
  opacity:.58;
  animation:v67OrbitB 1550ms linear infinite reverse;
}
@keyframes v67OrbitA{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes v67OrbitB{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
</style>
<script id="v71-number-flow-script">
(()=>{
  'use strict';
  const ride=document.getElementById('ride');
  const vehicle=document.getElementById('vehicle');
  const badge=document.getElementById('carNumber');
  if(!ride||!vehicle||!badge||typeof window.render!=='function')return;

  const ROUTE_LEFT=19.3, ROUTE_RIGHT=87.2, ROUTE_SPAN=ROUTE_RIGHT-ROUTE_LEFT;
  const CAR_X=.753, CAR_Y=.42;
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');

  const pointTraveler=document.createElement('div');
  pointTraveler.id='v67PointTraveler';
  pointTraveler.setAttribute('aria-hidden','true');
  ride.appendChild(pointTraveler);

  const resultTraveler=document.createElement('div');
  resultTraveler.id='v67ResultTraveler';
  resultTraveler.setAttribute('aria-hidden','true');
  ride.appendChild(resultTraveler);

  const flyer=document.createElement('div');
  flyer.id='v67FlightBadge';
  flyer.setAttribute('aria-hidden','true');
  ride.appendChild(flyer);

  function clamp01(v){return Math.max(0,Math.min(1,v));}
  function centerOf(el){
    if(!el)return null;
    const rr=ride.getBoundingClientRect(),r=el.getBoundingClientRect();
    if(!r.width&&!r.height)return null;
    return {x:r.left+r.width/2-rr.left,y:r.top+r.height/2-rr.top};
  }
  function measuredCenter(el){
    if(!el)return null;
    const r=el.getBoundingClientRect();
    if(r.width||r.height)return centerOf(el);
    const wasHidden=el.hidden;
    const prev={
      display:el.style.getPropertyValue('display'), displayP:el.style.getPropertyPriority('display'),
      visibility:el.style.getPropertyValue('visibility'), visibilityP:el.style.getPropertyPriority('visibility'),
      opacity:el.style.getPropertyValue('opacity'), opacityP:el.style.getPropertyPriority('opacity')
    };
    el.hidden=false;
    el.style.setProperty('display','inline-block','important');
    el.style.setProperty('visibility','hidden','important');
    el.style.setProperty('opacity','0','important');
    const c=centerOf(el);
    if(prev.display)el.style.setProperty('display',prev.display,prev.displayP);else el.style.removeProperty('display');
    if(prev.visibility)el.style.setProperty('visibility',prev.visibility,prev.visibilityP);else el.style.removeProperty('visibility');
    if(prev.opacity)el.style.setProperty('opacity',prev.opacity,prev.opacityP);else el.style.removeProperty('opacity');
    el.hidden=wasHidden;
    return c;
  }
  function theoreticalCarAnchor(p){
    const rr=ride.getBoundingClientRect();
    const vr=vehicle.getBoundingClientRect();
    const reverse=!!state.reverse;
    const physical=reverse?(ROUTE_RIGHT-ROUTE_SPAN*p):(ROUTE_LEFT+ROUTE_SPAN*p);
    const topPct=60.9-Math.sin(Math.PI*p)*.16;
    return {
      x:(physical/100)*rr.width + (CAR_X-.5)*vr.width,
      y:(topPct/100)*rr.height - (1-CAR_Y)*vr.height
    };
  }
  function setMath(el,v){
    try{setUnifiedMath(el,mathFmt(v));}
    catch(_e){el.textContent=String(v??'');}
    el.setAttribute('dir','ltr');
  }
  function lockBadgeSize(){
    const vw=vehicle.getBoundingClientRect().width||240;
    const values=[fmt(state.x),fmt(state.y)].map(v=>String(v??''));
    const base=Math.max(19,Math.min(34,vw*.13));
    const maxW=Math.max(70,vw*.50);
    const pad=Math.max(20,Math.min(34,vw*.11));
    if(ctx)ctx.font=`600 ${base}px Trebuchet MS`;
    const raw=Math.max(...values.map(text=>ctx?ctx.measureText(text).width:text.length*base*.59),1);
    let font=base,width=Math.max(54,raw+pad);
    if(width>maxW){
      font=Math.max(14,base*((maxW-pad)/Math.max(1,raw)));
      if(ctx)ctx.font=`600 ${font}px Trebuchet MS`;
      const shrunk=Math.max(...values.map(text=>ctx?ctx.measureText(text).width:text.length*font*.59),1);
      width=Math.min(maxW,Math.max(54,shrunk+pad));
    }
    badge.style.setProperty('--car-font',font+'px');
    badge.style.setProperty('--car-w',width+'px');
    resultTraveler.style.setProperty('--car-font',font+'px');
    flyer.style.setProperty('--car-font',font+'px');
    flyer.style.setProperty('--car-w',width+'px');
  }
  function setBadgeRole(isOutput){
    badge.classList.toggle('output',!!isOutput);
    badge.dataset.label='';
  }
  function seatBadge(value,isOutput){
    if(badge.parentElement!==vehicle)vehicle.appendChild(badge);
    badge.classList.add('v67-number-token');
    setBadgeRole(isOutput);
    setMath(badge,value);
    ['position','left','top','right','display','visibility','opacity'].forEach(p=>badge.style.removeProperty(p));
    badge.style.removeProperty('transform');
    badge.hidden=false;
    badge.style.setProperty('opacity','1','important');
    badge.style.setProperty('display','flex','important');
  }
  function hideBadge(){
    badge.classList.add('v67-number-token');
    badge.hidden=true;
    badge.style.setProperty('display','none','important');
    badge.style.setProperty('opacity','0','important');
  }
  function showFlyer(value,isOutput,x,y,transform){
    flyer.classList.toggle('v67-output',!!isOutput);
    setMath(flyer,value);
    flyer.style.setProperty('left',x+'px');
    flyer.style.setProperty('top',y+'px');
    flyer.style.setProperty('transform',transform||'translate(-50%,-50%)');
    flyer.style.setProperty('display','flex');
    flyer.style.setProperty('opacity','1');
  }
  function hideFlyer(){flyer.style.setProperty('display','none');flyer.style.setProperty('opacity','0');}
  function copyComputedPointStyle(source){
    if(!source)return;
    const cs=getComputedStyle(source);
    const props=['fontFamily','fontSize','fontWeight','fontStyle','lineHeight','letterSpacing','color','textShadow','filter'];
    for(const p of props)pointTraveler.style[p]=cs[p];
  }
  function showPointTraveler(value,source,x,y,scale){
    copyComputedPointStyle(source);
    setMath(pointTraveler,value);
    pointTraveler.style.setProperty('left',x+'px');
    pointTraveler.style.setProperty('top',y+'px');
    pointTraveler.style.setProperty('transform',`translate(-50%,-50%) scale(${scale})`);
    pointTraveler.style.setProperty('display','inline-block');
    pointTraveler.style.setProperty('opacity','1');
  }
  function hidePointTraveler(){pointTraveler.style.setProperty('display','none');pointTraveler.style.setProperty('opacity','0');}
  function showResultTraveler(value,isOutput,x,y,scale){
    setMath(resultTraveler,value);
    resultTraveler.classList.toggle('v67-output-role',!!isOutput);
    resultTraveler.classList.toggle('v67-input-role',!isOutput);
    resultTraveler.style.setProperty('left',x+'px');
    resultTraveler.style.setProperty('top',y+'px');
    resultTraveler.style.setProperty('transform',`translate(-50%,-50%) scale(${scale})`);
    resultTraveler.style.setProperty('display','flex');
    resultTraveler.style.setProperty('opacity','1');
  }
  function hideResultTraveler(){resultTraveler.style.setProperty('display','none');resultTraveler.style.setProperty('opacity','0');}

  function syncV71(){
    badge.classList.add('v67-number-token');
    lockBadgeSize();

    if(!document.body.classList.contains('ride-has-user-number')){
      hideBadge();hideFlyer();hidePointTraveler();hideResultTraveler();return;
    }

    const p=clamp01(Number(state.p)||0);
    const reverse=!!state.reverse;
    const inputValue=reverse?state.y:state.x;
    const resultValue=reverse?state.x:state.y;
    const inputIsOutput=reverse;
    const resultIsOutput=!reverse;
    const scene=ride.getBoundingClientRect();
    const firstBracket=document.getElementById(reverse?'outputBracket':'inputBracket');
    const finalBracket=document.getElementById(reverse?'inputBracket':'outputBracket');
    const first=measuredCenter(firstBracket) || theoreticalCarAnchor(.325);
    const final=measuredCenter(finalBracket) || theoreticalCarAnchor(reverse?.975:.955);

    if(p<.015){
      seatBadge(inputValue,inputIsOutput);
      hideFlyer();hidePointTraveler();hideResultTraveler();
      return;
    }

    /* First launch: original timing/motion; the car is empty during flight. */
    if(p<.325){
      const u=(p-.015)/.31, t=u*u*(3-2*u);
      const a=theoreticalCarAnchor(.015),b=first;
      const x=a.x+(b.x-a.x)*t;
      const y=a.y+(b.y-a.y)*t-Math.sin(Math.PI*u)*scene.height*.15;
      hideBadge();hidePointTraveler();hideResultTraveler();
      showFlyer(inputValue,inputIsOutput,x,y,`translate(-50%,-50%) rotate(${Math.sin(u*Math.PI*2)*13}deg) scale(${1+Math.sin(Math.PI*u)*.2})`);
      return;
    }

    /* Point -> cave: the moving number is a live visual twin of the number already in the point. */
    if(p<.475){
      const target=document.getElementById('equation')?.querySelector(reverse?'.y':'.x');
      if(firstBracket&&target){
        const s=firstBracket.getBoundingClientRect(), d=target.getBoundingClientRect();
        const u=(p-.325)/.15, t=u*u*(3-2*u);
        const sx=s.left+s.width/2-scene.left, sy=s.top+s.height/2-scene.top;
        const dx=d.left+d.width/2-scene.left, dy=d.top+d.height/2-scene.top;
        const x=sx+(dx-sx)*t;
        const y=sy+(dy-sy)*t;
        hideBadge();hideFlyer();hideResultTraveler();
        showPointTraveler(inputValue,firstBracket,x,y,1-.25*t);
        return;
      }
    }

    if(p<.62){
      hideBadge();hideFlyer();hidePointTraveler();hideResultTraveler();
      return;
    }

    /* Result exits immediately in the original .62-.70 window. */
    if(p<.70){
      const source=document.getElementById('equation');
      const answer=[...(source?.querySelectorAll(reverse?'.x':'.y')||[])].at(-1);
      const ar=(answer||source)?.getBoundingClientRect();
      const car=vehicle.getBoundingClientRect();
      if(ar){
        const u=(p-.62)/.08, t=u*u*(3-2*u);
        const sx=ar.left+ar.width*.5-scene.left, sy=ar.top+ar.height*.5-scene.top;
        const dx=car.left+car.width*.753-scene.left, dy=car.top+car.height*.602-scene.top;
        const x=sx+(dx-sx)*t;
        const y=sy+(dy-sy)*t-Math.sin(Math.PI*u)*scene.height*.035;
        hideBadge();hideFlyer();hidePointTraveler();
        showResultTraveler(resultValue,resultIsOutput,x,y,.86+.18*Math.sin(Math.PI*u));
        return;
      }
    }

    /* Small intentional pause after the result exits the cave, so the eye can register
       the value on the car before the upward hover starts. Quarter-second feel (~0.25s on a 14s ride). */
    const secondLaunchDelay=.018;
    const launchBeginBase=reverse?.84:.70;
    const launchBegin=launchBeginBase+secondLaunchDelay;
    if(p<launchBegin){
      seatBadge(resultValue,resultIsOutput);
      hideFlyer();hidePointTraveler();hideResultTraveler();
      return;
    }

    /* Both directions must hand off on the exact native frame:
       forward at p=.955 and reverse at p=.975.
       That guarantees the ringed flyer disappears in the very same frame
       that the point number becomes visible. */
    const bracketEnd=reverse?.975:.955;
    if(p<bracketEnd){
      const u=(p-launchBegin)/(bracketEnd-launchBegin), t=u*u*(3-2*u);
      const a=theoreticalCarAnchor(launchBegin),b=final;
      const x=a.x+(b.x-a.x)*t;
      const y=a.y+(b.y-a.y)*t-Math.sin(Math.PI*u)*scene.height*.15;
      seatBadge(resultValue,resultIsOutput);
      hidePointTraveler();hideResultTraveler();
      showFlyer(resultValue,resultIsOutput,x,y,`translate(-50%,-50%) rotate(${Math.sin(u*Math.PI*2)*13}deg) scale(${1+Math.sin(Math.PI*u)*.2})`);
      return;
    }

    /* Original legacy hand-off: once the upper copy has landed, it stops there.
       The hood value remains on the car until p=.995, then disappears as the dock becomes loaded. */
    if(p<.995){
      seatBadge(resultValue,resultIsOutput);
      hideFlyer();hidePointTraveler();hideResultTraveler();
      return;
    }

    hideBadge();hideFlyer();hidePointTraveler();hideResultTraveler();
  }

  const previousRender=window.render;
  const wrappedRender=function(){
    const out=previousRender.apply(this,arguments);
    try{syncV71();}catch(err){console.error('v71 number flow sync',err);}
    return out;
  };
  try{window.render=wrappedRender;render=wrappedRender;}catch(_e){window.render=wrappedRender;}

  window.addEventListener('resize',()=>requestAnimationFrame(()=>{try{syncV71();}catch(_e){}}),{passive:true});
  window.addEventListener('load',()=>requestAnimationFrame(()=>{try{syncV71();}catch(_e){}}),{once:true});
  requestAnimationFrame(()=>{try{syncV71();}catch(_e){}});
})();
</script>


</body></html>
