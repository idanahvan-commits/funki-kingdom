<style id="combined-first-frame-zero-free-lock">
/* Nothing numeric exists visually before a real user choice. */
body:not(.ride-has-user-number) #inputValue,
body:not(.ride-has-user-number) #chargeValue,
body:not(.ride-has-user-number) #carNumber,
body:not(.ride-has-user-number) #inputCopy,

}

body:not(.ride-has-user-number) .v50-charge-bar.input{
  display:none!important;visibility:hidden!important;opacity:0!important;
}

/* FUNCTION FIRST-PAINT GUARD: never reveal a fallback formula before the cylinder/API has supplied one. */
html:not(.fr-function-ready) .function-plaque>div,

  visibility:hidden!important;opacity:0!important;color:transparent!important;text-shadow:none!important;transition:none!important;

html.fr-function-ready #equation{
  visibility:visible!important;opacity:1!important;transition:none!important;
}

  display:none!important;visibility:hidden!important;opacity:0!important;
}
</style>

<style id="v50-final-prepaint-lock">
/* FIRST-PAINT FINAL LOCK: use the approved station geometry before the browser paints frame 1. */
#dockedScene{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;}
#leftMachine,#outputMachine{
  display:block!important;visibility:visible!important;opacity:1!important;
  transform:none!important;object-fit:contain!important;height:auto!important;max-width:none!important;
  image-rendering:auto!important;animation:none!important;transition:none!important;
  bottom:38.0%!important;
}
#outputMachine{right:-0.35%!important;}
#inputSmartPanel,#outputSmartPanel,
#inputSmartPanel:hover,#outputSmartPanel:hover,
#inputSmartPanel:focus,#outputSmartPanel:focus,
#inputSmartPanel:focus-visible,#outputSmartPanel:focus-visible,
#inputSmartPanel:active,#outputSmartPanel:active{
  background:transparent!important;background-image:none!important;opacity:0!important;
  border:0!important;outline:0!important;box-shadow:none!important;filter:none!important;
}
#inputSmartPanel::before,#inputSmartPanel::after,#outputSmartPanel::before,#outputSmartPanel::after{display:none!important;content:none!important;}
#chargeDock,#outputChargeDock,.v50-charge-bar{transition:none!important;}
/* PREPAINT HIDDEN-UI LOCK: these legacy controls are never part of the approved scene. */
.mode-switch,.characters,footer{display:none!important;visibility:hidden!important;opacity:0!important;}
/* PREPAINT VEHICLE GUARD: never show the car at its static DOM position. */
#vehicle{visibility:hidden!important;opacity:0!important;}
html.v50-car-ready #vehicle{visibility:visible!important;opacity:1!important;}
/* PREPAINT GLYPH GUARD: never show x/y at their static DOM position. */
#inputGlyph,#outputGlyph{visibility:hidden!important;opacity:0!important;}
html.v50-glyphs-ready #inputGlyph,html.v50-glyphs-ready #outputGlyph{visibility:visible!important;opacity:1!important;}
/* PREPAINT LABEL GUARD: avoid any first-paint flash in cave signs and slider captions. */
.station-label,#startLabel,#endLabel{visibility:hidden!important;opacity:0!important;}
html.v50-labels-ready .station-label,html.v50-labels-ready #startLabel,html.v50-labels-ready #endLabel{visibility:visible!important;opacity:1!important;}
@media(max-width:700px){#outputMachine{right:-0.2%!important;}}
</style>
<style id="master-derived-mode-visibility">

</style>

<style id="clean-unified-math-style">
/* Single approved math renderer for roots and vertical +/- across the scene. */
.math-root{display:inline-block;vertical-align:-.08em;overflow:visible;white-space:nowrap;line-height:1;color:inherit}
.math-root .math-root-path{fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.math-root .math-root-text{fill:currentColor;font-family:Georgia,"Times New Roman","Cambria Math",serif;font-weight:400;letter-spacing:0}
.math-pm{display:inline-flex;align-items:center;gap:.025em;vertical-align:middle;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.math-pm-stack{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;width:.45em;height:.78em;gap:.018em;font-size:.76em;line-height:.30;transform:translateY(.01em);flex:0 0 auto}
.math-pm-stack>span{display:block;height:.30em;line-height:.30;margin:0;padding:0;font-weight:700}
.math-pm-body{display:inline-flex;align-items:center;line-height:1;white-space:nowrap}.math-solution-pair{display:inline-flex;align-items:baseline;white-space:nowrap;gap:0}.math-solution-item{display:inline-flex;align-items:baseline;white-space:nowrap}.math-solution-sep{display:inline-block;margin:0 .14em}.math-eq{display:inline-block;margin:0 .10em}

/* Calculator screen: clear, larger, and safely in the lower portion of the painted glass. */
.input-calc-display{align-items:flex-end!important;justify-content:flex-start!important;padding:0 4.2% 1.8% 4.2%!important;font-size:clamp(28px,3.35vw,56px)!important;overflow:hidden!important}
.input-calc-single{justify-content:flex-start!important;align-items:flex-end!important;transform-origin:left bottom!important;line-height:1!important}
.input-calc-frac{align-items:flex-start!important;justify-content:flex-end!important;transform-origin:left bottom!important;padding-bottom:.08em!important}
.input-calc-frac-row{justify-content:flex-start!important;text-align:left!important}
.input-calc-frac-bar{margin-left:0!important;margin-right:auto!important}
.input-calc-display .math-root{height:.78em!important;vertical-align:0!important}
.input-calc-display .math-pm{align-items:flex-end!important}
.input-calc-display .math-pm-stack{height:.72em!important;font-size:.72em!important}

/* Keep the cave equation on one unbroken line. */
#calculation{overflow:visible!important}
#equation{display:inline-flex!important;flex-wrap:nowrap!important;align-items:baseline!important;justify-content:center!important;white-space:nowrap!important;width:max-content!important;max-width:none!important;overflow:visible!important;line-height:1.08!important}
#equation>*{flex:0 0 auto!important;white-space:nowrap!important}
#equation .math-root{height:1.02em!important;vertical-align:-.07em!important}
#equation .math-pm{align-items:baseline!important;vertical-align:baseline!important}
#equation .math-pm-body{align-items:baseline!important}
#equation .math-pm-stack{gap:2px!important}

/* Coordinate-system roots are deliberately lighter/smaller. */
#approvedMagicAxes .math-root{height:.90em!important;vertical-align:-.05em!important}
#approvedMagicAxes .math-root .math-root-path{stroke-width:1.10!important}
#approvedMagicAxes .math-pm{align-items:baseline!important;vertical-align:baseline!important}
#approvedMagicAxes .math-pm-body{align-items:baseline!important}
#approvedMagicAxes .math-pm-stack{gap:2px!important}
#valueTableGrid .math-root{height:.90em!important;vertical-align:-.05em!important}

/* Preserve top coordinate geometry while keeping values blank until their exact arrival. */
body:not(.ride-has-user-number) #pairX,body:not(.ride-has-user-number) #pairY{color:transparent!important;text-shadow:none!important}
</style>

(()=>{

     letting the machine's original gold rim remain visible as the only outer border. */
  const prevAlign=alignChargerControls;
  alignChargerControls=function(){
    prevAlign();
    const ride=document.getElementById('ride').getBoundingClientRect();
    const left=document.getElementById('leftMachine').getBoundingClientRect();
    const right=document.getElementById('outputMachine').getBoundingClientRect();
    const place=(id,rect,cx)=>{
      const el=document.getElementById(id); if(!el)return;
      const cy=992, w=288, h=430;
      el.style.left=`${rect.left+(cx/1024)*rect.width-ride.left}px`;
      el.style.top=`${rect.top+(cy/1536)*rect.height-ride.top}px`;
      el.style.width=`${(w/1024)*rect.width}px`;
      el.style.height=`${(h/1536)*rect.height}px`;
    };
    place('inputSmartPanel',left,420.5);
    place('outputSmartPanel',right,603.5);
  };

  /* Never let the glass number tile escape the circular crown window. */
  fitStationReadout=function(el){
    if(!el)return;
    const dock=el.parentElement;
    const machine=document.getElementById(el.id==='outputChargeValue'?'outputMachine':'leftMachine');
    if(!dock||!machine)return;
    const mw=machine.getBoundingClientRect().width||260;
    const text=((el.textContent||'0').trim())||'0';
    const minW=Math.max(68,mw*.28),maxW=Math.max(minW,mw*.415),h=Math.max(34,Math.min(48,mw*.145));
    const baseFont=Math.max(23,Math.min(39,mw*.12));
    const cv=fitStationReadout._cv||(fitStationReadout._cv=document.createElement('canvas'));
    const ctx=cv.getContext('2d');
    if(ctx)ctx.font=`600 ${baseFont}px Trebuchet MS`;
    const estimated=ctx?ctx.measureText(text).width:text.length*baseFont*.62;
    const needed=estimated+Math.max(24,mw*.075);
    const w=Math.max(minW,Math.min(maxW,needed));
    dock.style.setProperty('--dock-w',`${w}px`);
    dock.style.setProperty('--dock-h',`${h}px`);
    let size=baseFont;
    el.style.setProperty('--dock-font',`${size}px`);
    el.style.setProperty('--dock-scale','1');
    requestAnimationFrame(()=>{
      const available=Math.max(32,w-22);
      let guard=0;
      while(size>14 && el.scrollWidth>available && guard++<30){
        size-=1;
        el.style.setProperty('--dock-font',`${size}px`);
      }
    });
  };

    const a=document.getElementById('chargeValue'),b=document.getElementById('outputChargeValue');
    if(a)fitStationReadout(a);if(b)fitStationReadout(b);
    alignChargerControls();

(()=>{

  const outputPanel=document.getElementById('outputSmartPanel');

  if(!ride||!left||!right) return;

  /* Fill the complete inner keypad cavity (the area the red pen marked), while keeping the machine's own gold rim visible. */

    el.style.setProperty('width',`${(w/1024)*rect.width}px`,'important');
    el.style.setProperty('height',`${(h/1536)*rect.height}px`,'important');
  }

    placePanel(outputPanel,right.getBoundingClientRect(),603);
  }

  const measure=document.createElement('canvas').getContext('2d');

    const vw=vehicle.getBoundingClientRect().width||240;
    const text=((car.textContent||'0').trim())||'0';
    const base=Math.max(19,Math.min(34,vw*.13));

  function toggleCalculator(target,e){
    if(e){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();}
    if(modal.classList.contains('show')){
      closeInputCalc();
    }else{

      if(e.key==='Enter'||e.key===' '){toggleCalculator('input',e);}
    },true);
  }
  if(outputPanel){

<!-- V39 OUTPUT COVER 100% CLICK FIX:
     No visual assets, ride timing, car motion, or calculator artwork changed.
     A coordinate-level capture zone guarantees that every point of the visible
     output calculator cover toggles the output calculator, regardless of which
     transparent/static layer happens to be above that pixel. -->
<script id="v39-output-cover-full-hit-fix">
(()=>{
  const ride=document.getElementById('ride');
  const outputMachine=document.getElementById('outputMachine');
  const modal=document.getElementById('inputCalcModal');
  const calc=document.getElementById('inputCalc');
  if(!ride||!outputMachine||!modal||!calc)return;

  let handledPointerId=null;
  let handledAt=0;

  function outputCoverRect(){
    const machine=outputMachine.getBoundingClientRect();
    // Full visible cover/cavity area in the approved 1024x1536 station artwork.
    // Deliberately a few pixels wider/taller than the painted cover so there are
    // no dead strips along the gold edges or lower diamond boundary.
    const cx=603, cy=998, w=320, h=454;
    const centerX=machine.left+(cx/1024)*machine.width;
    const centerY=machine.top +(cy/1536)*machine.height;
    const width=(w/1024)*machine.width;
    const height=(h/1536)*machine.height;
    return {left:centerX-width/2,right:centerX+width/2,top:centerY-height/2,bottom:centerY+height/2};
  }

  function insideOutputCover(x,y){
    const r=outputCoverRect();
    return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
  }

  function toggleOutputCalculator(){
    if(modal.classList.contains('show')) closeInputCalc();
    else openInputCalc('output');
  }

  // Window capture fires before the older document/element handlers. This makes
  // the whole painted cover clickable even if another transparent layer owns
  // the event target at that exact pixel.
  window.addEventListener('pointerdown',e=>{
    if(!insideOutputCover(e.clientX,e.clientY))return;
    // Never reinterpret a click made inside the open calculator itself.
    if(modal.classList.contains('show')&&calc.contains(e.target))return;
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    handledPointerId=e.pointerId;
    handledAt=performance.now();
    toggleOutputCalculator();
  },true);

  // Suppress the synthetic click that follows the handled pointerdown, so the
  // older outputSmartPanel click listener cannot immediately toggle a second time.
  window.addEventListener('click',e=>{
    if(performance.now()-handledAt>700)return;
    if(!insideOutputCover(e.clientX,e.clientY))return;
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    handledPointerId=null;
    handledAt=0;
  },true);
})();
</script>

<script id="v50-final-fixed-charge-bars">
(()=>{
  const ride=document.getElementById('ride');
  const inDock=document.getElementById('chargeDock');
  const outDock=document.getElementById('outputChargeDock');
  const inMachine=document.getElementById('leftMachine');
  const outMachine=document.getElementById('outputMachine');
  if(!ride||!inDock||!outDock)return;

  function makeBar(kind){
    const bar=document.createElement('div');
    bar.className=`v50-charge-bar ${kind}`;
    bar.hidden=true;
    bar.setAttribute('aria-hidden','true');
    const fill=document.createElement('div');
    fill.className='v50-charge-fill';
    bar.appendChild(fill);
    ride.appendChild(bar);
    return {bar,fill,level:0,visible:false,timer:0};
  }
  const inputBar=makeBar('input');
  const outputBar=makeBar('output');

  function setLevel(obj,level,animate=true){
    level=Math.max(0,Math.min(100,level));
    obj.level=level;
    if(!animate){
      const old=obj.fill.style.transition;
      obj.fill.style.transition='none';
      obj.fill.style.width=level+'%';
      void obj.fill.offsetWidth;
      obj.fill.style.transition=old||'';
    }else obj.fill.style.width=level+'%';
  }
  function hideBar(obj){
    clearTimeout(obj.timer);obj.timer=0;obj.visible=false;obj.bar.hidden=true;obj.bar.classList.remove('is-loading');setLevel(obj,0,false);
  }
  function fillOnce(obj){
    clearTimeout(obj.timer);obj.visible=true;obj.bar.hidden=false;obj.bar.classList.remove('is-loading');
    setLevel(obj,0,false);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      obj.bar.classList.add('is-loading');
      setLevel(obj,100,true);
      obj.timer=setTimeout(()=>{obj.bar.classList.remove('is-loading');obj.timer=0;},1040);
    }));
  }

  function positionOne(obj,dock,machine){
    const rr=ride.getBoundingClientRect(),dr=dock.getBoundingClientRect(),mr=machine?machine.getBoundingClientRect():dr;
    if(!obj.visible||!dr.width||!dr.height||dock.hidden){obj.bar.hidden=true;return;}
    obj.bar.hidden=false;
    /* Final lock: the charge bar geometry follows the machine, never the changing number capsule. */
    const width=Math.max(36,mr.width*.235);
    const centerX=dr.left+dr.width/2;
    const centerY=dr.top+dr.height/2;
    const verticalOffset=Math.max(18,Math.min(24,mr.width*.082));
    obj.bar.style.left=(centerX-rr.left)+'px';
    obj.bar.style.top=(centerY-rr.top+verticalOffset)+'px';
    obj.bar.style.width=width+'px';
  }
  function alignBars(){positionOne(inputBar,inDock,inMachine);positionOne(outputBar,outDock,outMachine);}

  let lastDestLoaded=false;
  let explicitSelection=false;

  function syncDestination(){
    const reverse=!!state.reverse,destLoaded=state.p>=.995;
    /* Geometry is static during a ride. Only touch the bars when the destination state changes. */
    if(destLoaded!==lastDestLoaded){
      if(destLoaded){
        const target=reverse?inputBar:outputBar;
        target.visible=true;
        requestAnimationFrame(()=>{alignBars();fillOnce(target);});
      }
      lastDestLoaded=destLoaded;
    }
  }

  /* Only a real user value confirmation arms the source charge bar. Initial default value stays clean. */
  const originalInputCalcOk=window.inputCalcOk;
  if(typeof originalInputCalcOk==='function'){
    window.inputCalcOk=function(...args){explicitSelection=true;return originalInputCalcOk.apply(this,args);};
  }
  const numberInput=document.getElementById('numberInput');
  if(numberInput)numberInput.addEventListener('change',()=>{explicitSelection=true;},{capture:true});

  const originalSetNumber=window.setNumber;
  if(typeof originalSetNumber==='function'){
    window.setNumber=function(...args){
      const result=originalSetNumber.apply(this,args);
      lastDestLoaded=false;
      if(explicitSelection){
        const source=state.reverse?outputBar:inputBar,dest=state.reverse?inputBar:outputBar;
        hideBar(dest);source.visible=true;requestAnimationFrame(()=>{alignBars();fillOnce(source);});
        explicitSelection=false;
      }
      return result;
    };
  }

  const originalMode=window.mode;
  if(typeof originalMode==='function'){
    window.mode=function(...args){
      const hasValue=args.length>1 && Number.isFinite(Number(args[1]));
      const result=originalMode.apply(this,args);
      lastDestLoaded=false;
      if(explicitSelection||hasValue){
        const source=state.reverse?outputBar:inputBar,dest=state.reverse?inputBar:outputBar;
        hideBar(dest);source.visible=true;requestAnimationFrame(()=>{alignBars();fillOnce(source);});
        explicitSelection=false;
      }else{
        hideBar(inputBar);hideBar(outputBar);
      }
      return result;
    };
  }

  const originalRender=window.render;
  if(typeof originalRender==='function')window.render=function(...args){const r=originalRender.apply(this,args);syncDestination();return r;};
  const originalAlign=window.alignChargerControls;
  if(typeof originalAlign==='function')window.alignChargerControls=function(...args){const r=originalAlign.apply(this,args);alignBars();return r;};

  window.addEventListener('resize',()=>requestAnimationFrame(alignBars));
  window.addEventListener('load',()=>requestAnimationFrame(()=>{hideBar(inputBar);hideBar(outputBar);alignBars();}),{once:true});
  requestAnimationFrame(()=>requestAnimationFrame(()=>{hideBar(inputBar);hideBar(outputBar);alignBars();}));
})();
</script>

<script id="thousands-separators-only">
/* Visual formatting only: preserve v50 state, timing and calculations. */
(()=>{
  const groupAbs=(n)=>{
    n=Number(n);
    if(!Number.isFinite(n))return '0';
    const r=Math.round((Math.abs(n)+Number.EPSILON)*1000)/1000;
    let s=r.toFixed(3);
    while(s.includes('.')&&s.endsWith('0'))s=s.slice(0,-1);
    if(s.endsWith('.'))s=s.slice(0,-1);
    const parts=s.split('.');
    parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return parts.join('.');
  };
  fmt=function(n){const s=groupAbs(n);return Number(n)<0?`\u2066−${s}\u2069`:s;};
  mathFmt=function(n){const s=groupAbs(n);return Number(n)<0?`\u2066−${s}\u2069`:s;};
  requestAnimationFrame(()=>{try{if(typeof render==='function')render();}catch(e){}});
})();
</script>

<script id="v50-final-last-geometry-lock-js">
(()=>{
  /* Thousands separators are visual only; calculator buffers remain raw numeric strings. */
  const groupedVisual=(value)=>{
    let raw=String(value ?? '0').trim();
    let neg=false;
    if(raw.startsWith('-')||raw.startsWith('−')){neg=true;raw=raw.slice(1);}
    const dot=raw.indexOf('.');
    let intPart=dot>=0?raw.slice(0,dot):raw;
    const fracPart=dot>=0?raw.slice(dot):'';
    if(/^\d+$/.test(intPart)) intPart=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    const body=intPart+fracPart;
    return neg?`\u2066−${body}\u2069`:body;
  };
  try{ visualNumericText=groupedVisual; }catch(e){ window.visualNumericText=groupedVisual; }

  /* v50 behaviour, with a strict crystal-safe maximum width. Text shrinks before the capsule can escape the circle. */
  const fitReadout=(el)=>{
    if(!el)return;
    const dock=el.parentElement;
    const machine=document.getElementById(el.id==='outputChargeValue'?'outputMachine':'leftMachine');
    if(!dock||!machine)return;
    const text=((el.textContent||'0').trim())||'0';
    const mw=machine.getBoundingClientRect().width||260;
    const minW=Math.max(54,mw*.255);
    const maxW=Math.max(minW,mw*.360);   // FINAL: never cross the circular crystal
    const h=Math.max(32,Math.min(46,mw*.132));
    const pad=Math.max(7,Math.min(11,mw*.028));
    let size=Math.max(20,Math.min(38,mw*.108));
    const cv=fitReadout._cv||(fitReadout._cv=document.createElement('canvas'));
    const ctx=cv.getContext('2d');
    const measure=()=>{
      if(!ctx)return text.length*size*.61;
      ctx.font=`600 ${size}px Trebuchet MS`;
      return ctx.measureText(text).width;
    };
    let needed=measure()+pad*2;
    let width=Math.max(minW,Math.min(maxW,needed));
    const available=()=>Math.max(30,width-pad*2-2);
    while(size>9 && measure()>available()) size-=1;
    needed=measure()+pad*2;
    width=Math.max(minW,Math.min(maxW,needed));
    while(size>8 && measure()>Math.max(24,width-pad*2-2)) size-=1;
    dock.style.setProperty('--dock-w',`${width}px`);
    dock.style.setProperty('--dock-h',`${h}px`);
    dock.style.setProperty('--dock-font',`${size}px`);
    dock.style.setProperty('--dock-pad',`${pad}px`);
    el.style.fontSize=`${size}px`;
  };
  try{ fitStationReadout=fitReadout; }catch(e){ window.fitStationReadout=fitReadout; }

  /* Re-anchor x/y to the real crown-tip pixels of the NEW fixed assets.
     Blue apex: x≈423/1024. Mirrored red apex: x≈600/1024. */
  const previousAlign=window.alignChargerControls;
  const lockGeometry=()=>{
    if(typeof previousAlign==='function') previousAlign();
    const ride=document.getElementById('ride')?.getBoundingClientRect();
    const left=document.getElementById('leftMachine')?.getBoundingClientRect();
    const right=document.getElementById('outputMachine')?.getBoundingClientRect();
    const gx=document.getElementById('inputGlyph');
    const gy=document.getElementById('outputGlyph');
    if(ride&&left&&gx){
      gx.style.left=(left.left+left.width*(423/1024)-ride.left)+'px';
      gx.style.top=(left.top-ride.top+1)+'px';
      gx.style.transform='translate(-50%,-100%)';
    }
    if(ride&&right&&gy){
      gy.style.left=(right.left+right.width*(600/1024)-ride.left)+'px';
      gy.style.top=(right.top+right.height*(4/1536)-ride.top+1)+'px';
      gy.style.transform='translate(-50%,-100%)';
    }
    const a=document.getElementById('chargeValue');
    const b=document.getElementById('outputChargeValue');
    if(a)fitReadout(a); if(b)fitReadout(b);
  };
  window.alignChargerControls=lockGeometry;

  const leftImg=document.getElementById('leftMachine');
  const rightImg=document.getElementById('outputMachine');
  leftImg?.addEventListener('load',()=>requestAnimationFrame(lockGeometry));
  rightImg?.addEventListener('load',()=>requestAnimationFrame(lockGeometry));
  window.addEventListener('resize',()=>requestAnimationFrame(lockGeometry));
  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>requestAnimationFrame(lockGeometry));
    if(leftImg)ro.observe(leftImg); if(rightImg)ro.observe(rightImg);
  }

  /* Repaint calculator display immediately with grouped digits. */
  try{ if(typeof renderInputCalc==='function') renderInputCalc(); }catch(e){}
  lockGeometry();
})();
</script>

<script id="final-user-last-two-position-fixes-js">
(()=>{
  const measureCanvas=document.createElement('canvas');
  const measure=measureCanvas.getContext('2d');

  function strictFit(el){
    if(!el)return;
    const dock=el.parentElement;
    const machine=document.getElementById(el.id==='outputChargeValue'?'outputMachine':'leftMachine');
    if(!dock||!machine)return;
    const text=((el.textContent||'0').trim())||'0';
    const mw=machine.getBoundingClientRect().width||260;
    const minW=Math.max(48,mw*.225);
    const maxW=Math.max(minW,mw*.360);
    const h=Math.max(30,Math.min(44,mw*.126));
    const pad=Math.max(6,Math.min(9,mw*.024));
    let size=Math.max(18,Math.min(36,mw*.104));
    const textWidth=()=>{
      if(!measure)return text.length*size*.60;
      measure.font=`600 ${size}px Trebuchet MS`;
      return measure.measureText(text).width;
    };
    while(size>8 && textWidth()>Math.max(22,maxW-pad*2-3))size-=1;
    const width=Math.max(minW,Math.min(maxW,textWidth()+pad*2));
    dock.style.setProperty('--dock-w',`${width}px`);
    dock.style.setProperty('--dock-h',`${h}px`);
    dock.style.setProperty('--dock-font',`${size}px`);
    dock.style.setProperty('--dock-pad',`${pad}px`);
    el.style.fontSize=`${size}px`;
  }

  const previousAlign=window.alignChargerControls;
  function finalAlign(){
    if(typeof previousAlign==='function')previousAlign();
    const ride=document.getElementById('ride')?.getBoundingClientRect();
    const left=document.getElementById('leftMachine')?.getBoundingClientRect();
    const right=document.getElementById('outputMachine')?.getBoundingClientRect();
    const gx=document.getElementById('inputGlyph');

    if(ride&&left&&gx){
      gx.style.left=(left.left+left.width*(423/1024)-ride.left)+'px';
      gx.style.top=(left.top-ride.top)+'px';
      gx.style.transform='translate(-50%,-100%)';
    }
    if(ride&&right&&gy){
      gy.style.left=(right.left+right.width*(423/1024)-ride.left)+'px';
      gy.style.top=(right.top+right.height*(4/1536)-ride.top)+'px';
      gy.style.transform='translate(-50%,-100%)';
    }
    strictFit(document.getElementById('chargeValue'));
    strictFit(document.getElementById('outputChargeValue'));
  }
  window.alignChargerControls=finalAlign;

  /* Geometry is locked on load/resize only. Never force layout from every animation frame. */
  const leftImg=document.getElementById('leftMachine');
  const rightImg=document.getElementById('outputMachine');
  leftImg?.addEventListener('load',()=>requestAnimationFrame(finalAlign));
  rightImg?.addEventListener('load',()=>requestAnimationFrame(finalAlign));
  window.addEventListener('resize',()=>requestAnimationFrame(finalAlign));
  finalAlign();
})();

<script id="v50-absolute-final-locks-js">
(()=>{
  const ride=document.getElementById('ride');
  const leftMachine=document.getElementById('leftMachine');
  const rightMachine=document.getElementById('outputMachine');
  const inputGlyph=document.getElementById('inputGlyph');
  const outputGlyph=document.getElementById('outputGlyph');
  const inDock=document.getElementById('chargeDock');
  const outDock=document.getElementById('outputChargeDock');
  const inValue=document.getElementById('chargeValue');
  const outValue=document.getElementById('outputChargeValue');
  if(!ride||!leftMachine||!rightMachine)return;

  const measureCanvas=document.createElement('canvas');
  const measureCtx=measureCanvas.getContext('2d');

  function lockGlyph(glyph,machine,apexX,apexY){
    if(!glyph||!machine)return;
    const rr=ride.getBoundingClientRect();
    const mr=machine.getBoundingClientRect();
    if(!mr.width||!mr.height)return;
    const gr=glyph.getBoundingClientRect();
    const glyphSize=gr.width || Math.max(28,rr.width*.0235);
    /* ::before = 86% square rotated 45deg; its lower point extends 10.81% below the element box. */
    const tipExtra=glyphSize*((.86/Math.SQRT2)-.5);
    const x=mr.left+mr.width*(apexX/1024)-rr.left;
    const apex=mr.top+mr.height*(apexY/1536)-rr.top+(glyph===outputGlyph?1:0);
    glyph.style.setProperty('--locked-glyph-left',x+'px');
    glyph.style.setProperty('--locked-glyph-top',(apex-tipExtra)+'px');
  }

  function fitLockedDock(valueEl,dock,machine,cx){
    if(!valueEl||!dock||!machine)return;
    const rr=ride.getBoundingClientRect();
    const mr=machine.getBoundingClientRect();
    if(!mr.width||!mr.height)return;
    const raw=(valueEl.textContent||'0').trim()||'0';
    const mw=mr.width;
    const minW=Math.max(46,mw*.22);
    const maxW=Math.max(minW,mw*.335); // hard stop safely inside crystal
    const h=Math.max(29,Math.min(43,mw*.122));
    const pad=Math.max(6,Math.min(9,mw*.023));
    let font=Math.max(17,Math.min(35,mw*.100));
    const measured=()=>{
      if(!measureCtx)return raw.length*font*.6;
      measureCtx.font=`600 ${font}px Trebuchet MS`;
      return measureCtx.measureText(raw).width;
    };
    while(font>8 && measured()+pad*2>maxW)font-=1;
    const width=Math.max(minW,Math.min(maxW,measured()+pad*2));
    dock.style.setProperty('--locked-dock-left',(mr.left+mr.width*(cx/1024)-rr.left)+'px');
    dock.style.setProperty('--locked-dock-top',(mr.top+mr.height*(544/1536)-rr.top)+'px');
    dock.style.setProperty('--locked-dock-w',width+'px');
    dock.style.setProperty('--locked-dock-h',h+'px');
    dock.style.setProperty('--locked-dock-font',font+'px');
  }

  function lockBar(kind,machine,cx){
    const bar=document.querySelector('.v50-charge-bar.'+kind);
    if(!bar||!machine)return;
    const rr=ride.getBoundingClientRect();
    const mr=machine.getBoundingClientRect();
    if(!mr.width||!mr.height)return;
    /* Slightly shorter than the approved baked reference (245px -> 228px source width). */
    const width=mr.width*(228/1024);
    /* Fixed source-pixel height anchor. It sits clear of both the crystal tip and lower gold diamond. */
    const top=mr.top+mr.height*(622/1536)-rr.top;
    const left=mr.left+mr.width*(cx/1024)-rr.left;
    bar.style.setProperty('--locked-bar-left',left+'px');
    bar.style.setProperty('--locked-bar-top',top+'px');
    bar.style.setProperty('--locked-bar-w',width+'px');
  }

  function lockAll(){
    /* Input apex is x=423,y=0. Mirrored red file apex is x=600,y=6. */
    lockGlyph(inputGlyph,leftMachine,423,0);
    lockGlyph(outputGlyph,rightMachine,600,6);
    if(inputGlyph?.style.getPropertyValue('--locked-glyph-left') && outputGlyph?.style.getPropertyValue('--locked-glyph-left')){
      document.documentElement.classList.add('v50-glyphs-ready');
    }
    document.documentElement.classList.add('v50-labels-ready');
    fitLockedDock(inValue,inDock,leftMachine,423);
    fitLockedDock(outValue,outDock,rightMachine,600);
    lockBar('input',leftMachine,423);
    lockBar('output',rightMachine,600);
  }

  /* Recompute only when geometry or the displayed number really changes — never from ride progress. */
  const valueObserver=new MutationObserver(()=>requestAnimationFrame(lockAll));
  if(inValue)valueObserver.observe(inValue,{childList:true,characterData:true,subtree:true});
  if(outValue)valueObserver.observe(outValue,{childList:true,characterData:true,subtree:true});
  window.addEventListener('resize',()=>requestAnimationFrame(lockAll));
  leftMachine.addEventListener('load',()=>requestAnimationFrame(lockAll));
  rightMachine.addEventListener('load',()=>requestAnimationFrame(lockAll));
  window.addEventListener('load',()=>requestAnimationFrame(()=>requestAnimationFrame(lockAll)),{once:true});
  lockAll();
  requestAnimationFrame(lockAll);
})();
</script>

<script id="v50-static-dynamic-final-lock-script">
(function(){
  const ride = document.getElementById('ride');
  const leftMachine = document.getElementById('leftMachine');
  const rightMachine = document.getElementById('outputMachine');
  const inDock = document.getElementById('chargeDock');
  const outDock = document.getElementById('outputChargeDock');
  const inValue = document.getElementById('chargeValue');
  const outValue = document.getElementById('outputChargeValue');
  const inGlyph = document.getElementById('inputGlyph');
  const outGlyph = document.getElementById('outputGlyph');
  if(!ride || !leftMachine || !rightMachine) return;

  const measureCanvas = document.createElement('canvas');
  const measure = measureCanvas.getContext('2d');
  const cfg = {
    input: {machine:leftMachine, dock:inDock, value:inValue, glyph:inGlyph, cx:423/1024, apexX:423/1024, bar:'input'},
    output:{machine:rightMachine,dock:outDock,value:outValue,glyph:outGlyph,cx:600/1024,apexX:600/1024,bar:'output'}
  };

  function imp(el, prop, value){ if(el) el.style.setProperty(prop, value, 'important'); }

  function fitValueText(valueEl, dockWidth, machineWidth){
    if(!valueEl) return;
    const text = ((valueEl.textContent || '0').trim()) || '0';
    const pad = Math.max(12, machineWidth * 0.044);
    const inner = Math.max(18, dockWidth - pad);
    let font = Math.max(17, Math.min(36, machineWidth * 0.100));
    if(measure){
      while(font > 8){
        measure.font = `600 ${font}px Trebuchet MS`;
        if(measure.measureText(text).width <= inner) break;
        font -= 1;
      }
    }
    imp(valueEl, 'font-size', font + 'px');
    imp(valueEl, 'line-height', '1');
  }

  function lockDock(part){
    const machine = part.machine, dock = part.dock, valueEl = part.value;
    if(!machine || !dock || !valueEl) return;
    const rr = ride.getBoundingClientRect();
    const mr = machine.getBoundingClientRect();
    if(!mr.width || !mr.height) return;

    // Fixed geometry: the rectangle no longer changes size during the ride.
    const x = mr.left + mr.width * part.cx - rr.left;
    const y = mr.top + mr.height * (544/1536) - rr.top;
    const w = mr.width * (300/1024);   // safe inside the crystal circle
    const h = mr.width * (118/1024);

    imp(dock, 'left', x + 'px');
    imp(dock, 'top', y + 'px');
    imp(dock, 'width', w + 'px');
    imp(dock, 'min-width', w + 'px');
    imp(dock, 'max-width', w + 'px');
    imp(dock, 'height', h + 'px');
    imp(dock, 'transform', 'translate(-50%,-50%)');
    fitValueText(valueEl, w, mr.width);
  }

  function lockBar(part){
    const machine = part.machine;
    const bar = document.querySelector('.v50-charge-bar.' + part.bar);
    if(!machine || !bar) return;
    const rr = ride.getBoundingClientRect();
    const mr = machine.getBoundingClientRect();
    if(!mr.width || !mr.height) return;

    // Slightly shorter and fixed between the inner blue/red tip and the gold diamond below.
    const x = mr.left + mr.width * part.cx - rr.left;
    const y = mr.top + mr.height * (620/1536) - rr.top;
    const w = mr.width * (216/1024);

    imp(bar, 'left', x + 'px');
    imp(bar, 'top', y + 'px');
    imp(bar, 'width', w + 'px');
    imp(bar, 'height', (window.innerWidth <= 700 ? 5 : 6) + 'px');
    imp(bar, 'transform', 'translate(-50%,0)');
  }

  function lockGlyph(part){
    const machine = part.machine, glyph = part.glyph;
    if(!machine || !glyph) return;
    const rr = ride.getBoundingClientRect();
    const mr = machine.getBoundingClientRect();
    if(!mr.width || !mr.height) return;

    // Place the glyph by the real crown apex and make the diamond touch the apex.
    const x = mr.left + mr.width * part.apexX - rr.left;
    const glyphRect = glyph.getBoundingClientRect();
    const glyphSize = glyphRect.width || Math.max(28, rr.width * 0.0235);
    const tipExtra = glyphSize * ((0.86 / Math.SQRT2) - 0.5);
    const y = mr.top - rr.top - tipExtra + (glyph === outGlyph ? 3 : 2); // X stays locked; Y moves one additional pixel down for true apex contact

    imp(glyph, 'left', x + 'px');
    imp(glyph, 'top', y + 'px');
    imp(glyph, 'transform', 'translate(-50%,-100%)');
  }

  function lockAll(){
    lockDock(cfg.input);
    lockDock(cfg.output);
    lockBar(cfg.input);
    lockBar(cfg.output);
    lockGlyph(cfg.input);
    lockGlyph(cfg.output);
  }

  // Expose the final lock as the single geometry authority.
  window.alignChargerControls = lockAll;

  // Geometry is static while the car moves. Mutation/Resize observers below are sufficient.

  // Refit text only when the displayed number changes.
  const valueObserver = new MutationObserver(()=>requestAnimationFrame(lockAll));
  if(inValue) valueObserver.observe(inValue,{childList:true,characterData:true,subtree:true});
  if(outValue) valueObserver.observe(outValue,{childList:true,characterData:true,subtree:true});

  const ro = window.ResizeObserver ? new ResizeObserver(()=>requestAnimationFrame(lockAll)) : null;
  if(ro){
    ro.observe(ride);
    ro.observe(leftMachine);
    ro.observe(rightMachine);
  }

  leftMachine.addEventListener('load', ()=>requestAnimationFrame(lockAll));
  rightMachine.addEventListener('load', ()=>requestAnimationFrame(lockAll));
  window.addEventListener('resize', ()=>requestAnimationFrame(lockAll));
  window.addEventListener('load', ()=>requestAnimationFrame(()=>requestAnimationFrame(lockAll)), {once:true});

  // One extra sync after startup animation frames.
  lockAll();
})();
</script>

<script id="v50-no-cave-readout-jump-script">
(function(){
  const ride=document.getElementById('ride');
  const leftMachine=document.getElementById('leftMachine');
  const rightMachine=document.getElementById('outputMachine');
  const inputDock=document.getElementById('chargeDock');
  const outputDock=document.getElementById('outputChargeDock');
  const inputValue=document.getElementById('chargeValue');
  const outputValue=document.getElementById('outputChargeValue');
  if(!ride||!leftMachine||!rightMachine||!inputDock||!outputDock)return;

  const cv=document.createElement('canvas');
  const ctx=cv.getContext('2d');
  const cache=new WeakMap();

  function freezeOne(valueEl,dock,machine){
    if(!valueEl||!dock||!machine)return;
    const mr=machine.getBoundingClientRect();
    if(!mr.width)return;
    const text=((valueEl.textContent||'0').trim())||'0';
    const key=text+'|'+Math.round(mr.width*100)/100;
    if(cache.get(dock)===key && dock.style.getPropertyValue('--frozen-dock-w'))return;

    /* Same visual family as the approved V50 capsule, but calculated only when the value changes. */
    const minW=Math.max(46,mr.width*.22);
    const maxW=Math.max(minW,mr.width*.335);
    const h=Math.max(29,Math.min(43,mr.width*.122));
    const pad=Math.max(6,Math.min(9,mr.width*.023));
    let font=Math.max(17,Math.min(35,mr.width*.100));
    const measure=()=>{
      if(!ctx)return text.length*font*.60;
      ctx.font=`600 ${font}px Trebuchet MS`;
      return ctx.measureText(text).width;
    };
    while(font>8 && measure()+pad*2>maxW)font-=1;
    const width=Math.max(minW,Math.min(maxW,measure()+pad*2));

    dock.style.setProperty('--frozen-dock-w',width+'px');
    dock.style.setProperty('--frozen-dock-h',h+'px');
    dock.style.setProperty('--frozen-dock-font',font+'px');
    cache.set(dock,key);
  }

  function freezeAll(){
    freezeOne(inputValue,inputDock,leftMachine);
    freezeOne(outputValue,outputDock,rightMachine);
  }

  /* Replace the legacy per-frame fitter with a cached fitter. Render may call it, but
     it becomes a no-op until the displayed value or viewport geometry actually changes. */
  window.fitStationReadout=function(el){
    if(el===outputValue)freezeOne(outputValue,outputDock,rightMachine);
    else freezeOne(inputValue,inputDock,leftMachine);
  };
  try{ fitStationReadout=window.fitStationReadout; }catch(e){}

  const mo=new MutationObserver(()=>freezeAll());
  if(inputValue)mo.observe(inputValue,{childList:true,characterData:true,subtree:true});
  if(outputValue)mo.observe(outputValue,{childList:true,characterData:true,subtree:true});

  /* Geometry changes only on an actual viewport/machine resize, never because ride progress crossed a cave stage. */
  let resizeQueued=false;
  function onResize(){
    if(resizeQueued)return;
    resizeQueued=true;
    requestAnimationFrame(()=>{resizeQueued=false;cache.delete(inputDock);cache.delete(outputDock);freezeAll();});
  }
  window.addEventListener('resize',onResize);
  leftMachine.addEventListener('load',onResize);
  rightMachine.addEventListener('load',onResize);
  window.addEventListener('load',()=>requestAnimationFrame(()=>requestAnimationFrame(freezeAll)),{once:true});
  freezeAll();
})();
</script>

<script id="v51-function-api">
(() => {
  'use strict';
  const API_VERSION='1.0.0';
  const STORAGE_KEY='mamlachat.functionRide.function.v1';
  const EPS=1e-9;
  const DEFAULT_CONFIG=Object.freeze({type:'linear',m:1,b:1});
  const LESSON_MODE=document.documentElement.getAttribute('data-lesson-mode')||'';
  const IS_LOCKED_LESSON=!!LESSON_MODE;
  if(LESSON_MODE)document.documentElement.setAttribute('data-lesson-mode',LESSON_MODE);
  let currentConfig={...DEFAULT_CONFIG};
  let functionVisualReady=false;
  let lastInverse={kind:'one',solutions:[0],display:'0',discriminant:null};

  function parseNumericToken(v){
    if(typeof v==='number')return v;
    let s=String(v??'').trim().replace(/−/g,'-').replace(/\s+/g,'');
    if(!s)return NaN;
    let m=s.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))\/([+-]?(?:\d+(?:\.\d+)?|\.\d+))$/);
    if(m){const d=Number(m[2]);return d===0?NaN:Number(m[1])/d}
    m=s.match(/^([+-]?)√((?:\d+(?:\.\d+)?|\.\d+))$/);
    if(m){const n=Number(m[2]);if(n<0)return NaN;return (m[1]==='-'?-1:1)*Math.sqrt(n)}
    return Number(s);
  }
  const finite=n=>Number.isFinite(parseNumericToken(n));
  const clean=n=>{
    n=parseNumericToken(n); if(!Number.isFinite(n)) return n;
    const r=Math.round((n+Number.EPSILON)*1e8)/1e8;
    return Object.is(r,-0)?0:r;
  };
  const compact=n=>{
    if(typeof n==='string')return groupEveryThreeDigitsText(n);
    n=clean(n); if(!Number.isFinite(n))return String(n);
    let s=n.toFixed(3); while(s.includes('.')&&s.endsWith('0'))s=s.slice(0,-1); if(s.endsWith('.'))s=s.slice(0,-1);
    const neg=s.startsWith('-')?'−':''; if(neg)s=s.slice(1);
    const parts=s.split('.');
    parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return neg+parts[0]+(parts[1]?'.'+parts[1]:'');
  };
  const absText=n=>compact(Math.abs(clean(n)));
  const same=(a,b)=>Math.abs(Number(a)-Number(b))<EPS;
  const nearInt=n=>Number.isFinite(Number(n))&&Math.abs(Number(n)-Math.round(Number(n)))<1e-8;
  const sqrtRadicand=n=>{
    n=Number(n);
    if(!Number.isFinite(n))return null;
    const sq=n*n;
    const r=Math.round(sq);
    if(r<0||Math.abs(sq-r)>1e-6)return null;
    return r;
  };
  function exactValueDisplay(n,{asciiMinus=false}={}){
    const minus=asciiMinus?'-':'−';
    n=clean(n);
    if(!Number.isFinite(n))return String(n);
    if(nearInt(n))return compact(Math.round(n));
    const rad=sqrtRadicand(n);
    if(Number.isInteger(rad)&&rad>=0){
      const root=Math.round(Math.sqrt(rad));
      if(root*root===rad)return (n<0?minus:'')+compact(root);
      return (n<0?minus:'')+'√'+compact(rad);
    }
    return compact(n);
  }
  function inverseSolutionDisplays(inv=lastInverse){
    if(!inv||!Array.isArray(inv.solutions))return [];
    if(String(inv.display||'').startsWith('±')){
      const body=String(inv.display).slice(1).trim();
      const prettyNeg=(body.startsWith('-')||body.startsWith('−'))?body:'−'+body;
      return inv.solutions.length===1?[body]:[prettyNeg,body];
    }
    if(currentConfig?.type==='quadratic'&&inv.solutions.length===2&&Number.isFinite(Number(inv.discriminant))){
      const D=clean(Number(inv.discriminant)),rD=Math.round(D),sqrtD=Math.sqrt(Math.max(0,D));
      const irrational=D>0&&Math.abs(sqrtD-Math.round(sqrtD))>1e-8&&Math.abs(D-rD)<1e-8;
      if(irrational){
        const den=clean(2*Number(currentConfig.a)),base=clean(-Number(currentConfig.b));
        const root='√'+compact(rD);
        const expr=sgn=>{
          const num=(same(base,0)?'':compact(base)+(sgn<0?' − ':' + '))+root;
          if(same(den,1))return num;if(same(den,-1))return '−('+num+')';return '('+num+') ÷ '+compact(den);
        };
        const pairs=[{v:clean((base-sqrtD)/den),d:expr(-1)},{v:clean((base+sqrtD)/den),d:expr(1)}].sort((a,b)=>a.v-b.v);
        return pairs.map(p=>p.d);
      }
    }
    return inv.solutions.map(v=>exactValueDisplay(v));
  }

  function normalizeConfig(raw){
    raw=(raw&&typeof raw==='object')?raw:{};
    if(raw.function&&typeof raw.function==='object')raw=raw.function;
    if(raw.functionRide&&typeof raw.functionRide==='object')raw=raw.functionRide;
    const named=String(raw.type||raw.family||raw.kind||raw.shape||'').toLowerCase();
    let type=(named.includes('quad')||named.includes('parab')||named.includes('פרב')||('a' in raw&&'c' in raw))?'quadratic':'linear';
    if(named.includes('lin')||named.includes('line')||named.includes('ישר'))type='linear';
    if(type==='quadratic'){
      const a=finite(raw.a)?clean(raw.a):1, b=finite(raw.b)?clean(raw.b):0, c=finite(raw.c)?clean(raw.c):0;
      if(Math.abs(a)<EPS)return {type:'linear',m:b,b:c};
      return {type:'quadratic',a,b,c};
    }
    const m=finite(raw.m)?clean(raw.m):1, b=finite(raw.b)?clean(raw.b):0;
    return {type:'linear',m,b};
  }

  function configFromQuery(){
    try{
      const q=new URLSearchParams(location.search);
      for(const key of ['functionRide','function','config','fr']){
        if(q.has(key)){
          try{return normalizeConfig(JSON.parse(q.get(key)))}catch(_e){}
        }
      }
      if(![...q.keys()].some(k=>['type','family','kind','m','b','a','c'].includes(k)))return null;
      const o={}; ['type','family','kind','m','b','a','c'].forEach(k=>{if(q.has(k))o[k]=q.get(k)}); return normalizeConfig(o);
    }catch(e){return null}
  }
  function configFromStorage(){try{const s=localStorage.getItem(STORAGE_KEY);return s?normalizeConfig(JSON.parse(s)):null}catch(e){return null}}
  function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(currentConfig))}catch(e){}}

  function linearRhsText(c=currentConfig){
    const m=clean(c.m), b=clean(c.b); let out='';
    if(same(m,0)) out='0';
    else if(same(m,1)) out='x';
    else if(same(m,-1)) out='−x';
    else out=compact(m)+'x';
    if(!same(b,0)) out += b>0?' + '+absText(b):' − '+absText(b);
    return out;
  }
  function quadraticRhsText(c=currentConfig){
    const parts=[]; const a=clean(c.a),b=clean(c.b),cc=clean(c.c);
    if(!same(a,0)){
      let t=same(Math.abs(a),1)?'x²':absText(a)+'x²'; if(a<0)t='−'+t; parts.push({sign:a<0?-1:1,text:t.replace(/^−/,'')});
    }
    if(!same(b,0)){
      let t=same(Math.abs(b),1)?'x':absText(b)+'x'; parts.push({sign:b<0?-1:1,text:t});
    }
    if(!same(cc,0)||parts.length===0)parts.push({sign:cc<0?-1:1,text:absText(cc)});
    let out=''; parts.forEach((p,i)=>{if(i===0)out=(p.sign<0?'−':'')+p.text;else out+=(p.sign<0?' − ':' + ')+p.text}); return out;
  }
  function formulaText(c=currentConfig){return 'y = '+(c.type==='quadratic'?quadraticRhsText(c):linearRhsText(c))}

  function evaluate(x,c=currentConfig){
    x=Number(x); if(!Number.isFinite(x))return NaN;
    return clean(c.type==='quadratic'?(c.a*x*x+c.b*x+c.c):(c.m*x+c.b));
  }

  function symmetricDisplay(rad,roots){
    if(rad>=-EPS){
      rad=Math.max(0,clean(rad)); const root=Math.sqrt(rad);
      if(Math.abs(root-Math.round(root))<1e-8)return '±'+compact(Math.round(root));
      if(Math.abs(rad-Math.round(rad))<1e-8)return '±√'+compact(Math.round(rad));
    }
    return compact(roots[0])+' / '+compact(roots[1]);
  }

  function inverse(y,c=currentConfig){
    y=Number(y); if(!Number.isFinite(y))return {kind:'none',solutions:[],display:'∅',discriminant:null};
    if(c.type==='linear'){
      const m=Number(c.m), b=Number(c.b);
      if(Math.abs(m)<EPS){
        return same(y,b)?{kind:'infinite',solutions:[],display:'ℝ',discriminant:null}:{kind:'none',solutions:[],display:'∅',discriminant:null};
      }
      const x=clean((y-b)/m); return {kind:'one',solutions:[x],display:compact(x),discriminant:null};
    }
    const a=Number(c.a), b=Number(c.b), cc=Number(c.c);
    let D=clean(b*b-4*a*(cc-y));
    if(D<-EPS)return {kind:'none',solutions:[],display:'∅',discriminant:D};
    if(Math.abs(D)<EPS){const x=clean(-b/(2*a));return {kind:'one',solutions:[x],display:compact(x),discriminant:0}}
    const s=Math.sqrt(Math.max(0,D)); let r1=clean((-b-s)/(2*a)),r2=clean((-b+s)/(2*a)); if(r1>r2)[r1,r2]=[r2,r1];
    const rad=(y-cc)/a;
    const display=Math.abs(b)<EPS?symmetricDisplay(rad,[r1,r2]):compact(r1)+' / '+compact(r2);
    return {kind:'two',solutions:[r1,r2],display,discriminant:D};
  }

  window.mathFmt=v=>typeof v==='string'?v:exactValueDisplay(v);
  window.fmt=v=>typeof v==='string'?v:exactValueDisplay(v);
  try{mathFmt=window.mathFmt;fmt=window.fmt}catch(_e){}

  function xSpan(v='x'){return `<span class="x">${v}</span>`}
  function ySpan(v='y'){return `<span class="y">${v}</span>`}
  function pmStackHtml(){return '<span class="math-pm-stack" aria-label="פלוס מינוס"><span>+</span><span>−</span></span>'}
  function solutionDisplayHtml(inv=lastInverse){const d=String(inv?.display??'');if(d.startsWith('±')){const body=d.slice(1).trim();return '<span class="math-pm">'+pmStackHtml()+'<span class="math-pm-body">'+mathTokenHtml(body)+'</span></span>'}return mathTokenHtml(d)}
  function solutionPairHtml(values){const items=(values||[]).map(v=>'<span class="math-solution-item">'+mathTokenHtml(v)+'</span>');return '<span class="math-solution-pair">'+items.join('<span class="math-solution-sep"> / </span>')+'</span>'}
  function decorateEquationHtml(html){return String(html||'').replace(/ = /g,' <span class="math-eq">=</span> ')}
  function signedConstHtml(v){v=clean(v);return same(v,0)?'':(v>0?' + '+absText(v):' − '+absText(v))}
  function coeffTimesValue(coeff,value,power2=false){
    coeff=clean(coeff); const vv='('+xSpan(mathTokenHtml(exactValueDisplay(value)))+')'+(power2?'²':'');
    if(same(coeff,1))return vv; if(same(coeff,-1))return '−'+vv; return compact(coeff)+'·'+vv;
  }
  function forwardExprHtml(x,c=currentConfig){
    if(c.type==='linear'){
      let first=same(c.m,0)?'0':coeffTimesValue(c.m,x,false); return first+signedConstHtml(c.b);
    }
    const terms=[];
    if(!same(c.a,0))terms.push({v:coeffTimesValue(Math.abs(c.a),x,true),neg:c.a<0});
    if(!same(c.b,0))terms.push({v:coeffTimesValue(Math.abs(c.b),x,false),neg:c.b<0});
    if(!same(c.c,0)||!terms.length)terms.push({v:absText(c.c),neg:c.c<0});
    let out='';terms.forEach((t,i)=>out+=(i?(t.neg?' − ':' + '):(t.neg?'−':''))+t.v);return out;
  }
  function linearRhsHtml(c=currentConfig){
    const m=clean(c.m), b=clean(c.b); let out='';
    if(same(m,0))out='0';
    else if(same(m,1))out=xSpan('x');
    else if(same(m,-1))out='−'+xSpan('x');
    else out=compact(m)+xSpan('x');
    return out+signedConstHtml(b);
  }
  function quadraticRhsHtml(c=currentConfig){
    const terms=[];
    if(!same(c.a,0)){const core=(same(Math.abs(c.a),1)?'':absText(c.a))+xSpan('x')+'²';terms.push({neg:c.a<0,v:core})}
    if(!same(c.b,0)){const core=(same(Math.abs(c.b),1)?'':absText(c.b))+xSpan('x');terms.push({neg:c.b<0,v:core})}
    if(!same(c.c,0)||!terms.length)terms.push({neg:c.c<0,v:absText(c.c)});
    let out='';terms.forEach((t,i)=>out+=(i?(t.neg?' − ':' + '):(t.neg?'−':''))+t.v);return out;
  }
  function formulaHtml(c=currentConfig){
    return ySpan('y')+' = '+(c.type==='quadratic'?quadraticRhsHtml(c):linearRhsHtml(c));
  }
  // Display rule: never show division by 1 (or -1). Redundant unit divisors are simplified away.
  function displayDivision(numeratorHtml,denominator){
    denominator=clean(denominator);
    if(same(denominator,1))return numeratorHtml;
    if(same(denominator,-1))return '−('+numeratorHtml+')';
    return '('+numeratorHtml+') ÷ '+compact(denominator);
  }
  function reverseSolveHtml(y,c=currentConfig){
    if(c.type==='linear'){
      if(Math.abs(c.m)<EPS)return xSpan('x')+' = '+(same(y,c.b)?'ℝ':'∅');
      const inner=exactValueDisplay(y)+(c.b>0?' − '+absText(c.b):c.b<0?' + '+absText(c.b):'');
      return xSpan('x')+' = '+displayDivision(inner,c.m)+' = '+xSpan(solutionDisplayHtml(lastInverse));
    }
    if(lastInverse.kind==='none')return xSpan('x')+' = ∅';
    if(lastInverse.kind==='infinite')return xSpan('x')+' = ℝ';
    if(Math.abs(c.b)<EPS){
      const rad=clean((Number(y)-c.c)/c.a);
      const inside=exactValueDisplay(y)+(c.c>0?' − '+absText(c.c):c.c<0?' + '+absText(c.c):'');
      const rootExpr=displayDivision(inside,c.a);
      return xSpan('x')+' = <span class="math-pm">'+pmStackHtml()+'<span class="math-pm-body">'+mathRootHtml('('+rootExpr+')')+'</span></span> = '+xSpan(solutionDisplayHtml(lastInverse));
    }
    const D=compact(lastInverse.discriminant);
    const numerator=compact(-c.b)+' <span class="math-pm">'+pmStackHtml()+'<span class="math-pm-body">'+mathRootHtml(D)+'</span></span>';
    return xSpan('x')+' = '+displayDivision(numerator,2*c.a)+' = '+xSpan(solutionPairHtml(inverseSolutionDisplays(lastInverse)));
  }

  function applyMathVisuals(){
    const plaque=document.querySelector('.function-plaque>div');
    const eq=document.getElementById('equation');
    if(!functionVisualReady){
      if(plaque){plaque.textContent='';plaque.classList.remove('v51-long-formula')}
      if(eq){eq.innerHTML='';eq.classList.remove('v51-long','v51-xlong')}
      const hint=document.getElementById('calcHint'); if(hint)hint.textContent='';
      const cap=document.getElementById('calcCaption'); if(cap)cap.textContent='';
      return;
    }
    if(plaque){const t=formulaText(); if(plaque.textContent!==t)plaque.textContent=t; plaque.classList.toggle('v51-long-formula',t.length>16)}
    if(!eq)return;
    const p=Number(state.p)||0, reverse=!!state.reverse, sourcePlaced=p>=.475;
    let html;
    if(!reverse){
      if(!sourcePlaced)html=formulaHtml();
      else if(p<.52)html=ySpan('y')+' = '+forwardExprHtml(state.x);
      else html=ySpan('y')+' = '+forwardExprHtml(state.x)+' = '+ySpan(window.mathFmt(state.y));
    }else{
      if(!sourcePlaced)html=formulaHtml();
      else if(p<.52)html=ySpan(window.mathFmt(state.y))+' = '+(currentConfig.type==='quadratic'?quadraticRhsHtml():linearRhsHtml());
      else html=reverseSolveHtml(state.y);
    }
    html=decorateEquationHtml(html);
    if(eq.innerHTML!==html)eq.innerHTML=html;
    fitEquationOneLine();
    const text=(eq.textContent||'').trim(); eq.classList.toggle('v51-long',text.length>25&&text.length<=42);eq.classList.toggle('v51-xlong',text.length>42);
    const hint=document.getElementById('calcHint'); if(hint)hint.textContent='';
    const cap=document.getElementById('calcCaption'); if(cap)cap.textContent='';
  }

  const baseRender=window.render;
  let lastMathVisualKey='';
  if(typeof baseRender==='function')window.render=function(){
    const r=baseRender.apply(this,arguments);
    const p=Number(state.p)||0;
    const phase=p<.475?0:(p<.52?1:2);
    const cfg=currentConfig||{};
    const key=[state.reverse?'R':'F',phase,state.x,state.y,cfg.type,cfg.m,cfg.b,cfg.a,cfg.c].join('|');
    if(key!==lastMathVisualKey){lastMathVisualKey=key;applyMathVisuals();}
    return r;
  };

  const baseSetNumber=window.setNumber;
  if(typeof baseSetNumber==='function')window.setNumber=function(n){
    if(!IS_LOCKED_LESSON&&!functionVisualReady)return;
    n=clean(Number(n)); if(!Number.isFinite(n))return;
    const r=baseSetNumber.call(this,n); // preserve every approved animation/charging side effect
    if(state.reverse){state.y=n;lastInverse=inverse(n);state.x=lastInverse.display;state.xSolutions=[...lastInverse.solutions]}
    else{state.x=n;state.xSolutions=[n];state.y=evaluate(n);lastInverse={kind:'one',solutions:[n],display:compact(n),discriminant:null}}
    if(typeof window.render==='function')window.render();
    if(typeof window.drawCabinets==='function')window.drawCabinets();
    return r;
  };

  function notify(source){
    const detail={version:API_VERSION,function:{...currentConfig},source:source||'api'};
    try{window.dispatchEvent(new CustomEvent('functionride:change',{detail}))}catch(e){}
    try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'FUNCTION_RIDE_FUNCTION_CHANGED',...detail},'*')}catch(e){}
  }
  function setFunction(raw,opts={}){
    if(IS_LOCKED_LESSON&&!opts.allowLockedOverride)return {...currentConfig};
    currentConfig=normalizeConfig(raw); window.__FUNCTION_RIDE_CONFIG__={...currentConfig};
    functionVisualReady=true;
    document.documentElement.classList.add('fr-function-ready');
    if(opts.persist!==false)persist();
    const sourceValue=state.reverse?Number(state.y):Number(state.x);
    if(Number.isFinite(sourceValue)&&typeof window.setNumber==='function')window.setNumber(sourceValue); else applyMathVisuals();
    if(opts.notify!==false)notify(opts.source||'api');
    return {...currentConfig};
  }
  function getFunction(){return {...currentConfig}}
  function setDirection(dir,value){const rev=dir===true||String(dir).toLowerCase()==='reverse'||String(dir).toLowerCase()==='output'; if(typeof window.mode==='function')window.mode(rev,value);return rev?'reverse':'forward'}
  function setInput(x){if(typeof window.mode==='function'&&state.reverse)window.mode(false,Number(x));else window.setNumber(Number(x));return state.y}
  function setOutput(y){if(typeof window.mode==='function'&&!state.reverse)window.mode(true,Number(y));else window.setNumber(Number(y));return {display:state.x,solutions:[...(state.xSolutions||[])]}}
  function getState(){
    const xSolutions=[...(state.xSolutions||[])];
    const reverse=!!state.reverse;
    return {
      direction:reverse?'reverse':'forward',
      x:state.x,
      y:state.y,
      xSolutions,
      xDisplay:reverse?String(state.x):exactValueDisplay(state.x),
      yDisplay:exactValueDisplay(state.y),
      xSolutionDisplays:reverse?inverseSolutionDisplays(lastInverse):xSolutions.map(v=>exactValueDisplay(v)),
      progress:state.p,
      function:getFunction()
    }
  }
  function applyProject(project,opts={}){return setFunction(project?.functionRide||project?.function||project?.mathFunction||project,opts)}

  window.FunctionRide=Object.freeze({version:API_VERSION,storageKey:STORAGE_KEY,setFunction,getFunction,evaluate:x=>(functionVisualReady?evaluate(x):null),inverse:y=>(functionVisualReady?inverse(y):null),setInput,setOutput,setDirection,getState,applyProject,formatExact:exactValueDisplay,getInverseSolutionDisplays:()=>inverseSolutionDisplays(lastInverse)});

  window.addEventListener('message',event=>{
    const d=event.data; if(!d||typeof d!=='object')return;
    const types=['FUNCTION_RIDE_SET_FUNCTION','FUNCTION_RIDE_CONFIG','MAMLACHAT_FUNCTION_SET'];
    if(types.includes(d.type)){
      const cfg=d.function||d.config||d.payload||d;
      const out=setFunction(cfg,{persist:d.persist!==false,notify:true,source:'postMessage'});
      try{event.source?.postMessage({type:'FUNCTION_RIDE_ACK',requestId:d.requestId||null,function:out,version:API_VERSION},'*')}catch(e){}
    }
    if(d.type==='FUNCTION_RIDE_GET_STATE')try{event.source?.postMessage({type:'FUNCTION_RIDE_STATE',requestId:d.requestId||null,state:getState(),version:API_VERSION},'*')}catch(e){}
  });
  window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&e.newValue)try{setFunction(JSON.parse(e.newValue),{persist:false,notify:true,source:'storage'})}catch(err){}});

  // MASTER startup policy:
  // - MASTER itself has no fixed fallback function and waits for the cylinder/API/editor.
  // - Derived learning modes are truly locked to y=x+1.
  const queryConfig=configFromQuery();
  let awaitingFunction=true;
  if(IS_LOCKED_LESSON){
    currentConfig={...DEFAULT_CONFIG};
    window.__FUNCTION_RIDE_CONFIG__={...currentConfig};
    functionVisualReady=true;
    document.documentElement.classList.add('fr-function-ready');
    applyMathVisuals();
    awaitingFunction=false;
  }else if(queryConfig){
    currentConfig={...queryConfig};
    window.__FUNCTION_RIDE_CONFIG__={...currentConfig};
    functionVisualReady=true;
    document.documentElement.classList.add('fr-function-ready');
    applyMathVisuals();
    awaitingFunction=false;
  }else{
    window.__FUNCTION_RIDE_CONFIG__=null;
    functionVisualReady=false;
    document.documentElement.classList.remove('fr-function-ready');
    applyMathVisuals();
  }
  const readyMessage={type:'FUNCTION_RIDE_READY',version:API_VERSION,function:awaitingFunction?null:getFunction(),awaitingFunction};
  try{if(window.parent&&window.parent!==window)window.parent.postMessage(readyMessage,'*')}catch(e){}
  try{if(window.opener&&!window.opener.closed)window.opener.postMessage(readyMessage,'*')}catch(e){}
})();
</script>

}

<script id="v67-value-table-script">
(()=>{
  'use strict';
  const ride=document.getElementById('ride');
  if(!ride)return;

  const STORAGE_KEY='MAMLECHET_VALUE_TABLE_LAYOUT_V10';
  const DEFAULT_LAYOUT=Object.freeze({
    component:'value-table',version:10,rightPct:24.5,topPct:73.2,baseWidthPct:34.5,baseHeightPct:24.2,
    extraColumnPct:4.9,maxWidthPct:64,scale:.82,minSlots:5,zIndex:34,
    xColor:'#70efff',yColor:'#ffabd8',expandDirection:'left'
  });
  let layout={...DEFAULT_LAYOUT};
  try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved&&typeof saved==='object')layout={...layout,...saved};}catch(_e){}

  const panel=document.createElement('section');
  panel.id='valueTablePanel';
  panel.setAttribute('aria-label','טבלת ערכי x ו-y');
  panel.innerHTML=`
    <div class="vt-shell">
      <div class="vt-grid" id="valueTableGrid"></div>
    </div>
    <div class="vt-controls" aria-label="פעולות טבלה">
      <button class="vt-btn vt-reset" id="valueTableReset" type="button" title="איפוס הטבלה" aria-label="איפוס הטבלה">↺</button>
      <button class="vt-btn vt-min" id="valueTableMin" type="button" title="מזעור הטבלה" aria-label="מזעור הטבלה">−</button>
    </div>`;
  ride.appendChild(panel);
  const grid=panel.querySelector('#valueTableGrid');
  const minBtn=panel.querySelector('#valueTableMin');
  const resetBtn=panel.querySelector('#valueTableReset');

  function applyLayout(next,persist=true){
    layout={...layout,...next};
    if(Number.isFinite(+layout.rightPct))panel.style.setProperty('--vt-right',(+layout.rightPct)+'%');
    if(Number.isFinite(+layout.topPct))panel.style.setProperty('--vt-top',(+layout.topPct)+'%');
    if(Number.isFinite(+layout.scale))panel.style.setProperty('--vt-scale',String(+layout.scale));
    if(Number.isFinite(+layout.zIndex))panel.style.zIndex=String(+layout.zIndex);
    if(layout.xColor)panel.style.setProperty('--vt-x',String(layout.xColor));
    if(layout.yColor)panel.style.setProperty('--vt-y',String(layout.yColor));
    if(persist){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(layout));}catch(_e){}}
    updateMetrics();
    return {...layout};
  }

  const entries=new Map();
  let latestX=null;
  let pending=null;
  let minimized=false;
  let birth={key:null,row:null,token:0};
  let birthTimer=0;
  let lastP=0;

  const fmtValue=(v)=>{
    let raw=typeof window.mathFmt==='function'?String(window.mathFmt(v)):String(v);
    raw=raw.replace(/[\u2066\u2067\u2068\u2069]/g,'').trim();
    let neg='';
    if(raw.startsWith('-')||raw.startsWith('−')){neg='−';raw=raw.slice(1)}
    const m=raw.match(/^(\d+)(\.\d+)?$/);
    if(m){
      const grouped=m[1].replace(/\B(?=(\d{3})+(?!\d))/g,',');
      return neg+grouped+(m[2]||'');
    }
    return neg+raw;
  };
  const keyOf=(x)=>String(Math.round((Number(x)+Number.EPSILON)*1e8)/1e8);
  function getOrCreate(x){const key=keyOf(x);if(!entries.has(key))entries.set(key,{x:Number(x),xText:null,xVisible:false,y:null,yText:null,yVisible:false});return entries.get(key)}
  function sortedEntries(){return [...entries.values()].sort((a,b)=>a.x-b.x)}
  function slotCount(){return Math.max(Number(layout.minSlots)||5,sortedEntries().length)}
  function updateMetrics(){
    const slots=slotCount(),min=Number(layout.minSlots)||5;
    const baseW=Number(layout.baseWidthPct)||34.5;
    const extraW=Number(layout.extraColumnPct)||4.9;
    const maxW=Number(layout.maxWidthPct)||64;
    const naturalW=baseW+Math.max(0,slots-min)*extraW;
    const w=Math.min(maxW,naturalW);
    const dense=Math.max(0,slots-7);
    const fontScale=slots<=5?1:slots===6?.93:slots===7?.86:Math.max(.52,.81-dense*.055);
    panel.style.setProperty('--vt-width',w+'%');
    panel.style.setProperty('--vt-height',(Number(layout.baseHeightPct)||24.2)+'%');
    panel.style.setProperty('--vt-num-scale',String(fontScale));
    grid.style.setProperty('--slots',String(slots));
    panel.classList.toggle('vt-dense',slots>5);
  }
  function pulse(x,row){birth={key:keyOf(x),row,token:birth.token+1};clearTimeout(birthTimer);birthTimer=setTimeout(()=>{birth={key:null,row:null,token:birth.token+1};renderTable()},1220)}
  let fitRAF=0;
  function fitCellTexts(){
    cancelAnimationFrame(fitRAF);
    fitRAF=requestAnimationFrame(()=>{
      const slots=slotCount();
      grid.querySelectorAll('.vt-cell').forEach(cell=>{
        const txt=cell.querySelector('.vt-text');
        if(!txt)return;
        cell.style.fontSize='';
        txt.style.transform='';
        if(cell.classList.contains('vt-empty'))return;
        const raw=(txt.textContent||'').trim();
        const basePx=parseFloat(getComputedStyle(cell).fontSize)||24;
        const safeWidth=cell.clientWidth*(slots<=5?.80:slots===6?.75:slots===7?.70:.66);
        const measured=txt.scrollWidth||txt.getBoundingClientRect().width||1;
        let scale=Math.min(1,safeWidth/Math.max(1,measured));
        scale=Math.max(.46,scale);
        cell.style.fontSize=(basePx*scale).toFixed(3)+'px';
        requestAnimationFrame(()=>{
          const m2=txt.scrollWidth||txt.getBoundingClientRect().width||1;
          if(m2>safeWidth*1.01){
            const current=parseFloat(getComputedStyle(cell).fontSize)||basePx;
            cell.style.fontSize=(current*(safeWidth/m2)).toFixed(3)+'px';
          }
        });
      });
    });
  }
  function renderTable(){
    const values=sortedEntries();
    grid.replaceChildren();
    updateMetrics();
    const slots=slotCount();
    for(const row of ['x','y']){
      for(let i=0;i<slots;i++){
        const cell=document.createElement('div');
        const inner=document.createElement('span');
        inner.className='vt-text';
        cell.className='vt-cell '+(row==='x'?'vt-x':'vt-y')+(i===0?' vt-first-col':'');
        cell.style.gridColumn=String(i+1);
        cell.style.gridRow=row==='x'?'1':'2';

          const val=row==='x'?e.x:e.y;

  function noteKnown(side,value){
    const v=Number(value);if(!Number.isFinite(v))return;

      const y=Number.isFinite(Number(s?.y))?Number(s.y):v;
      const yText=(s?.yDisplay!=null&&s?.yDisplay!=='')?String(s.yDisplay):exactValue(y);

        latestX=sols[0];
        sols.forEach((x,idx)=>{const e=getOrCreate(x);e.x=x;e.xText=solutionDisplays[idx]||exactValue(x);e.y=y;e.yText=yText;e.yVisible=true;if(idx===0)pulse(x,'y')});
      }

  }
  function revealPending(){

      const texts=Array.isArray(pending.solutionDisplays)?pending.solutionDisplays:[];
      sols.forEach((x,idx)=>{const e=getOrCreate(x);e.x=x;e.xText=texts[idx]||e.xText;e.xVisible=true;e.yText=pending.yText??e.yText;if(idx===0)pulse(x,'x')});

  }
  function refreshStableLayout(){requestAnimationFrame(()=>{updateMetrics();renderTable();requestAnimationFrame(()=>{updateMetrics();renderTable()})})}
  function captureTableMiniRight(){
    const rr=ride.getBoundingClientRect(),pr=panel.getBoundingClientRect();

    const ancestorScale=rr.width/Math.max(1,ride.clientWidth||rr.width);

  }
  function setMinimized(v){

  }
  const clampScale=v=>+Math.max(.48,Math.min(1.2,v)).toFixed(2);
  resetBtn.addEventListener('click',e=>{e.stopPropagation();resetTable()});
  minBtn.addEventListener('click',e=>{e.stopPropagation();setMinimized(!minimized)});
  panel.addEventListener('click',e=>{if(minimized){e.stopPropagation();setMinimized(false)}});
  window.addEventListener('resize',refreshStableLayout);
  window.addEventListener('orientationchange',refreshStableLayout);

  window.ValueTable={
    noteInput:(x)=>noteKnown('x',x),noteOutput:(y)=>noteKnown('y',y),reveal:revealPending,reset:resetTable,
    minimize:()=>setMinimized(true),expand:()=>setMinimized(false),setLayout:(cfg)=>applyLayout(cfg,true),
    getLayout:()=>({...layout}),getState:()=>({latestX,entries:sortedEntries().map(e=>({...e})),pending:pending?{...pending}:null,minimized})
  };

  let userSelectionArmedUntil=0;
  const armUserSelection=()=>{userSelectionArmedUntil=performance.now()+1400};
  const consumeUserSelection=()=>{
    const ok=performance.now()<=userSelectionArmedUntil;
    userSelectionArmedUntil=0;
    return ok;
  };
  document.addEventListener('click',e=>{

  },true);
  if(typeof window.inputCalcOk==='function'){
    const previousInputCalcOk=window.inputCalcOk;
    window.inputCalcOk=function(...args){armUserSelection();return previousInputCalcOk.apply(this,args)};
  }

  const oldSetNumber=window.setNumber||setNumber;
  const wrappedSetNumber=function(n){
    const r=oldSetNumber(n);
    if(consumeUserSelection())noteKnown(state.reverse?'y':'x',state.reverse?state.y:state.x);
    return r;
  };
  try{window.setNumber=wrappedSetNumber;setNumber=wrappedSetNumber}catch(_e){window.setNumber=wrappedSetNumber}

  const oldRender=window.render||render;

  };
  try{window.render=wrappedRender;render=wrappedRender}catch(_e){window.render=wrappedRender}

  window.addEventListener('functionride:change',()=>resetTable());

  window.addEventListener('message',ev=>{
    const d=ev.data;if(!d||typeof d!=='object')return;
    if(d.type==='VALUE_TABLE_LAYOUT'&&d.layout)applyLayout(d.layout,true);

    else if(d.type==='VALUE_TABLE_OUTPUT')noteKnown('y',d.value);
    else if(d.type==='VALUE_TABLE_REVEAL')revealPending();
  });

  // Final play version: visual editor removed.
  const testN=Math.max(0,Math.min(14,Number(new URLSearchParams(location.search).get('tableTest'))||0));
  applyLayout(layout,false);resetTable();
  if(testN){entries.clear();const vals=[154,-1562,0,15,-156,8,-4,101,3,-22,42,250,-999,77].slice(0,testN);for(const x of vals){const e=getOrCreate(x);e.x=x;e.y=x+1;e.xVisible=e.yVisible=true}latestX=vals.at(-1)??0;renderTable()}
})();
</script>

 const groupThousands=s=>String(s??'').replace(/,/g,'').replace(/\d{4,}/g,m=>m.replace(/\B(?=(\d{3})+(?!\d))/g,','));

 };
 const showEl=(el,on)=>{el.hidden=!on;el.style.opacity=on?'1':'0'};

<script id="r002-function-editor-preview-script">
(() => {
  'use strict';
  const module=document.getElementById('functionEditorModule');
  const panel=document.getElementById('functionEditorPanel');
  const input=document.getElementById('functionEditorInput');
  const mirror=document.getElementById('functionEditorMirror');
  const hint=document.getElementById('functionEditorHint');
  const plug=document.getElementById('functionEditorPlug');
  const socket=document.getElementById('functionEditorSocket');
  const joint=document.getElementById('functionEditorJointHit');
  const connected=document.getElementById('functionEditorConnected');
  const ride=document.getElementById('ride');
  if(!module||!panel||!input||!mirror||!window.FunctionRide)return;

  let opened=false;
  let wasPlaying=false;
  const htmlEscape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const prettyMinus=s=>String(s).replace(/-/g,'−');
  const plainMinus=s=>String(s).replace(/−/g,'-');

  function configToFormula(c){
    c=c||window.FunctionRide.getFunction();
    const num=n=>{
      n=Number(n); if(Object.is(n,-0))n=0;
      let s=Number.isInteger(n)?String(n):String(Math.round(n*1000)/1000);
      return prettyMinus(s);
    };
    const term=(coef,symbol,first)=>{
      coef=Number(coef); if(Math.abs(coef)<1e-12)return '';
      const neg=coef<0,abs=Math.abs(coef),body=(Math.abs(abs-1)<1e-12?'':num(abs))+symbol;
      if(first)return (neg?'−':'')+body;
      return (neg?' − ':' + ')+body;
    };
    if(c.type==='quadratic'){
      let out='';
      if(Math.abs(Number(c.a))>1e-12)out+=term(c.a,'x²',true);
      if(Math.abs(Number(c.b))>1e-12)out+=term(c.b,'x',!out);
      if(Math.abs(Number(c.c))>1e-12||!out){const cc=Number(c.c);out+=(!out?(cc<0?'−':''):(cc<0?' − ':' + '))+num(Math.abs(cc));}
      return 'y = '+out;
    }
    let out='';const m=Number(c.m),b=Number(c.b);
    if(Math.abs(m)>1e-12)out+=term(m,'x',true);
    if(Math.abs(b)>1e-12||!out)out+=(!out?(b<0?'−':''):(b<0?' − ':' + '))+num(Math.abs(b));
    return 'y = '+out;
  }

  function colorFormula(text){
    const chars=[...String(text)];
    mirror.innerHTML=chars.map(ch=>{
      const esc=htmlEscape(ch);
      if(ch==='y'||ch==='Y')return `<span class="fe-y">${esc}</span>`;
      if(ch==='x'||ch==='X')return `<span class="fe-x">${esc}</span>`;
      return `<span>${esc===' ' ? '&nbsp;' : esc}</span>`;
    }).join('');
  }

  function numericToken(s){
    s=plainMinus(String(s)).replace(/,/g,'.').trim();
    if(!s)return NaN;
    const f=s.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))\/([+-]?(?:\d+(?:\.\d+)?|\.\d+))$/);
    if(f){const d=Number(f[2]);return d===0?NaN:Number(f[1])/d;}
    return Number(s);
  }

  function parsePolynomialFormula(raw){
    let s=plainMinus(String(raw||'')).toLowerCase().trim();
    s=s.replace(/\s+/g,'').replace(/[·*]/g,'').replace(/x\^2/g,'x²');
    s=s.replace(/^f\(x\)=/,'').replace(/^y=/,'');
    if(!s||s.includes('='))throw new Error('יש לכתוב משוואה אחת, למשל y = 2x + 3');
    if(/[()]/.test(s))throw new Error('בשלב הזה כתוב את הפונקציה בצורה מפורשת, למשל y = x² − 3x + 2');
    if(/[^0-9x²+\-./]/.test(s))throw new Error('המערכת מקבלת כרגע מספרים, x, חזקת 2 ופעולות +/−');
    if(!/^[+-]/.test(s))s='+'+s;
    const terms=s.match(/[+-][^+-]+/g)||[];
    if(!terms.length)throw new Error('לא זוהתה פונקציה');
    let a=0,b=0,c=0;
    for(const t0 of terms){
      const sign=t0[0]==='-'?-1:1; const t=t0.slice(1);
      if(!t)throw new Error('חסר איבר אחרי סימן');
      if(t.includes('x²')){
        if(t.indexOf('x²')!==t.length-2||t.slice(0,-2).includes('x'))throw new Error('איבר ריבועי לא תקין');
        let k=t.slice(0,-2); const n=k===''?1:numericToken(k); if(!Number.isFinite(n))throw new Error('מקדם לא תקין ליד x²'); a+=sign*n;
      }else if(t.includes('x')){
        if(t.indexOf('x')!==t.length-1||t.slice(0,-1).includes('x'))throw new Error('איבר x לא תקין');
        let k=t.slice(0,-1); const n=k===''?1:numericToken(k); if(!Number.isFinite(n))throw new Error('מקדם לא תקין ליד x'); b+=sign*n;
      }else{
        const n=numericToken(t); if(!Number.isFinite(n))throw new Error('מספר לא תקין בפונקציה'); c+=sign*n;
      }
    }
    const clean=n=>Math.abs(n)<1e-10?0:Math.round(n*1e8)/1e8;
    a=clean(a);b=clean(b);c=clean(c);
    if(a!==0)return {type:'quadratic',a,b,c};
    return {type:'linear',m:b,b:c};
  }

  function syncFromCaveEquation(){
    const eq=document.getElementById('equation');
    if(!eq)return;
    const es=getComputedStyle(eq);
    [mirror,input].forEach(el=>{
      el.style.fontFamily=es.fontFamily;
      el.style.fontWeight=es.fontWeight;
      el.style.fontStyle=es.fontStyle;
      el.style.letterSpacing=es.letterSpacing;
    });
    const yNode=eq.querySelector('.y');
    const xNode=eq.querySelector('.x');
    if(yNode)module.style.setProperty('--fe-y',getComputedStyle(yNode).color);
    if(xNode)module.style.setProperty('--fe-x',getComputedStyle(xNode).color);
    const plain=[...eq.querySelectorAll('span')].find(n=>!n.classList.contains('x')&&!n.classList.contains('y'));
    module.style.setProperty('--fe-white',getComputedStyle(plain||eq).color);
  }

  function setError(msg=''){
    panel.classList.toggle('is-invalid',!!msg);hint.textContent=msg;
    if(msg)setTimeout(()=>panel.classList.remove('is-invalid'),380);
  }

  function pauseRideForEdit(){
    try{
      wasPlaying=!!window.state?.playing;
      if(window.state){window.state.playing=false;window.state.paused=wasPlaying||window.state.paused;}
      if(window.state?.rideFrame)cancelAnimationFrame(window.state.rideFrame);
      if(typeof window.render==='function')window.render();
    }catch(e){}
  }

  function currentFormulaForEditor(){
    const ready=document.documentElement.classList.contains('fr-function-ready') && !!window.__FUNCTION_RIDE_CONFIG__;
    return ready ? configToFormula(window.FunctionRide.getFunction()) : '';
  }

  function openEditor(){
    if(opened)return; opened=true; setError(''); syncFromCaveEquation();
    input.value=currentFormulaForEditor(); colorFormula(input.value);
    module.classList.add('is-open');ride.classList.add('function-editor-editing');
    joint.setAttribute('aria-label','הפונקציה במצב עריכה');pauseRideForEdit();
    setTimeout(()=>{input.focus({preventScroll:true});input.setSelectionRange(input.value.length,input.value.length);},420);
  }

  function applyAndClose(){
    if(!opened)return;
    try{
      const cfg=parsePolynomialFormula(input.value);
      setError('');
      window.FunctionRide.setFunction(cfg,{persist:true,notify:true,source:'in-ride-editor'});
      input.value=configToFormula(window.FunctionRide.getFunction()); colorFormula(input.value);
      opened=false;module.classList.remove('is-open');ride.classList.remove('function-editor-editing');
      joint.setAttribute('aria-label','נתק את השקע והתקע כדי להקליד פונקציה');
      input.blur();
    }catch(err){setError(err?.message||'הפונקציה לא נקלטה');input.focus({preventScroll:true});}
  }

  function toggleFromConnector(){ opened?applyAndClose():openEditor(); }
  joint.addEventListener('click',openEditor);
  plug.addEventListener('click',toggleFromConnector);
  socket.addEventListener('click',toggleFromConnector);
  input.addEventListener('input',()=>{setError('');colorFormula(input.value)});
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();applyAndClose();}
    if(e.key==='Escape'){e.preventDefault();input.value=currentFormulaForEditor();colorFormula(input.value);if(input.value)applyAndClose();else{opened=false;module.classList.remove('is-open');ride.classList.remove('function-editor-editing');input.blur();}}
  });
  input.addEventListener('click',()=>colorFormula(input.value));

  window.addEventListener('functionride:change',()=>{
    syncFromCaveEquation();
    if(!opened){input.value=currentFormulaForEditor();colorFormula(input.value);}
  });

  syncFromCaveEquation();
  input.value=currentFormulaForEditor();colorFormula(input.value);
  window.FunctionRideEditorPreview=Object.freeze({open:openEditor,apply:applyAndClose,parse:parsePolynomialFormula,get openState(){return opened}});
})();
</script>
